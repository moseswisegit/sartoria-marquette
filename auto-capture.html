<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Génération Automatique des Captures - CouturioShop</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 2rem;
            color: #333;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 16px;
            padding: 2rem;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        h1 {
            color: #1A73B5;
            margin-bottom: 1rem;
            font-size: 2rem;
        }

        .info {
            background: #e3f2fd;
            border-left: 4px solid #1A73B5;
            padding: 1rem;
            margin-bottom: 2rem;
            border-radius: 4px;
        }

        .progress-container {
            margin: 2rem 0;
        }

        .progress-bar {
            width: 100%;
            height: 30px;
            background: #e0e0e0;
            border-radius: 15px;
            overflow: hidden;
            margin-bottom: 1rem;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, #1A73B5, #4a90e2);
            transition: width 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 0.9rem;
        }

        .status {
            text-align: center;
            font-size: 1.1rem;
            margin-bottom: 1rem;
            color: #666;
        }

        .current-screen {
            background: #f5f5f5;
            padding: 1rem;
            border-radius: 8px;
            margin-bottom: 1rem;
            font-weight: 500;
        }

        .btn {
            width: 100%;
            padding: 1rem;
            background: #1A73B5;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 1rem;
        }

        .btn:hover {
            background: #155a8f;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(26, 115, 181, 0.4);
        }

        .btn:disabled {
            background: #ccc;
            cursor: not-allowed;
            transform: none;
        }

        .log {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
            margin-top: 1rem;
        }

        .log-item {
            padding: 0.25rem 0;
            border-bottom: 1px solid #eee;
        }

        .log-item.success {
            color: #4caf50;
        }

        .log-item.error {
            color: #f44336;
        }

        .log-item.info {
            color: #2196f3;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📸 Génération Automatique des Captures</h1>
        
        <div class="info">
            <strong>⚠️ Important :</strong> Ce script va ouvrir chaque maquette dans un nouvel onglet, 
            prendre une capture d'écran, puis la télécharger. Vous devrez peut-être autoriser les téléchargements 
            automatiques dans votre navigateur.
        </div>

        <div class="progress-container">
            <div class="status" id="status">Prêt à commencer</div>
            <div class="current-screen" id="currentScreen">-</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill" style="width: 0%">0%</div>
            </div>
        </div>

        <button class="btn" id="startBtn" onclick="startCapture()">🚀 Démarrer la Génération</button>

        <div class="log" id="log"></div>
    </div>

    <script>
        const screens = [
            { name: "Mot de Passe Oublié", folder: "mot_de_passe_oublié" },
            { name: "Recherche Avancée Marketplace", folder: "recherche_avancée_marketplace" },
            { name: "Prise de Mesures - Résumé IA", folder: "prise_de_mesures_-_résumé_ia" },
            { name: "Création de Commande", folder: "création_de_commande" },
            { name: "Centre de Notifications", folder: "centre_de_notifications" },
            { name: "Notation & Avis Tailleur", folder: "notation_&_avis_tailleur" },
            { name: "Sélecteur de Textures HD", folder: "sélecteur_de_textures_hd" },
            { name: "Détails Profil Tailleur", folder: "détails_profil_tailleur" },
            { name: "Portfolio Tailleur", folder: "portfolio_tailleur" },
            { name: "Gestion Stock Tissus Détaillée", folder: "gestion_stock_tissus_détaillée" },
            { name: "Détails & Médiation Litige", folder: "détails_&_médiation_litige" }
        ];

        const basePath = "stitch_onboarding_ia_mesures 3";
        let currentIndex = 0;
        let isCapturing = false;

        function log(message, type = 'info') {
            const logDiv = document.getElementById('log');
            const item = document.createElement('div');
            item.className = `log-item ${type}`;
            item.textContent = `[${new Date().toLocaleTimeString()}] ${message}`;
            logDiv.appendChild(item);
            logDiv.scrollTop = logDiv.scrollHeight;
        }

        function updateProgress(index, total) {
            const percent = Math.round((index / total) * 100);
            document.getElementById('progressFill').style.width = percent + '%';
            document.getElementById('progressFill').textContent = `${percent}% (${index}/${total})`;
            document.getElementById('status').textContent = `Progression: ${index}/${total} captures`;
        }

        async function captureScreen(screen) {
            return new Promise((resolve, reject) => {
                const htmlPath = `${basePath}/${encodeURIComponent(screen.folder)}/code.html`;
                const fullPath = window.location.origin + '/' + htmlPath;
                
                log(`Ouverture de: ${screen.name}`, 'info');
                document.getElementById('currentScreen').textContent = `📸 ${screen.name}`;
                
                // Ouvrir dans un nouvel onglet
                const newWindow = window.open(htmlPath, '_blank');
                
                if (!newWindow) {
                    reject(new Error('Popup bloquée. Autorisez les popups pour ce site.'));
                    return;
                }

                // Attendre que la page se charge
                newWindow.onload = function() {
                    setTimeout(async () => {
                        try {
                            log(`Capture de: ${screen.name}...`, 'info');
                            
                            // Utiliser html2canvas pour capturer
                            const canvas = await html2canvas(newWindow.document.body, {
                                width: 390,
                                height: 844,
                                scale: 2,
                                useCORS: true,
                                allowTaint: false,
                                backgroundColor: '#ffffff'
                            });

                            // Convertir en blob et télécharger
                            canvas.toBlob(function(blob) {
                                const url = URL.createObjectURL(blob);
                                const a = document.createElement('a');
                                a.href = url;
                                a.download = `screen_${screen.folder.replace(/[^a-z0-9]/gi, '_')}.png`;
                                document.body.appendChild(a);
                                a.click();
                                document.body.removeChild(a);
                                URL.revokeObjectURL(url);
                                
                                log(`✓ Capture générée: ${screen.name}`, 'success');
                                
                                newWindow.close();
                                resolve();
                            }, 'image/png');
                            
                        } catch (error) {
                            log(`✗ Erreur pour ${screen.name}: ${error.message}`, 'error');
                            newWindow.close();
                            reject(error);
                        }
                    }, 2000); // Attendre 2 secondes pour le chargement complet
                };
            });
        }

        async function startCapture() {
            if (isCapturing) return;
            
            isCapturing = true;
            const btn = document.getElementById('startBtn');
            btn.disabled = true;
            btn.textContent = '⏳ Génération en cours...';
            
            log('🚀 Démarrage de la génération automatique', 'info');
            
            for (let i = 0; i < screens.length; i++) {
                currentIndex = i;
                updateProgress(i, screens.length);
                
                try {
                    await captureScreen(screens[i]);
                    // Attendre un peu entre chaque capture
                    await new Promise(resolve => setTimeout(resolve, 1000));
                } catch (error) {
                    log(`Erreur: ${error.message}`, 'error');
                }
            }
            
            updateProgress(screens.length, screens.length);
            document.getElementById('status').textContent = '✅ Génération terminée !';
            document.getElementById('currentScreen').textContent = 'Toutes les captures ont été générées';
            
            btn.disabled = false;
            btn.textContent = '✅ Terminé';
            isCapturing = false;
            
            log('🎉 Toutes les captures ont été générées !', 'success');
            log('💡 Renommez les fichiers téléchargés et placez-les dans les bons dossiers', 'info');
        }

        // Initialiser
        updateProgress(0, screens.length);
        log('Prêt. Cliquez sur "Démarrer la Génération" pour commencer.', 'info');
    </script>
</body>
</html>
