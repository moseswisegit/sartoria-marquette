<!DOCTYPE html>

<script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1a73b7",
                        "background-light": "#f6f7f8",
                        "background-dark": "#111a21",

<style>

        }
        .dark .custom-glass {
            background: rgba(17, 26, 33, 0.7);
        }
        .texture-swatch {
            transition: all 0.2s ease;
        }
        .texture-swatch:active {
            transform: scale(0.9);
        }
    </style>
<style>
