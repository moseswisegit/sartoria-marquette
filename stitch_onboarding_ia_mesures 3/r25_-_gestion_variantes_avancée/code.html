<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestion Variantes - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Variantes</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Produit -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                <p class="font-semibold text-gray-900 mb-1">Robe élégante</p>
                <p class="text-xs text-gray-600">Gestion des variantes (Taille, Couleur)</p>
            </div>
            
            <!-- Variantes existantes -->
            <div>
                <div class="flex items-center justify-between mb-4">
                    <h3 class="text-gray-900 font-bold">Variantes (6)</h3>
                    <button class="flex items-center gap-2 px-3 py-1.5 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-colors">
                        <span class="material-symbols-outlined text-lg">add</span>
                        <span>Ajouter</span>
                    </button>
                </div>
                <div class="space-y-2">
                    <div class="p-3 bg-white rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="font-semibold text-gray-900">S - Bleu</p>
                                <p class="text-xs text-gray-600">Stock: 12 • Prix: 25,000 FCFA</p>
                            </div>
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">edit</span>
                            </button>
                        </div>
                        <div class="w-16 h-16 rounded-lg bg-blue-200 border-2 border-blue-400"></div>
                    </div>
                    <div class="p-3 bg-white rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="font-semibold text-gray-900">M - Bleu</p>
                                <p class="text-xs text-gray-600">Stock: 8 • Prix: 25,000 FCFA</p>
                            </div>
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">edit</span>
                            </button>
                        </div>
                        <div class="w-16 h-16 rounded-lg bg-blue-200 border-2 border-blue-400"></div>
                    </div>
                    <div class="p-3 bg-white rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="font-semibold text-gray-900">L - Rouge</p>
                                <p class="text-xs text-gray-600">Stock: 5 • Prix: 27,000 FCFA</p>
                            </div>
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">edit</span>
                            </button>
                        </div>
                        <div class="w-16 h-16 rounded-lg bg-red-200 border-2 border-red-400"></div>
                    </div>
                </div>
            </div>
            
            <!-- Création rapide -->
            <div class="pt-4 border-t border-gray-200">
                <h3 class="text-gray-900 font-bold mb-3">Création rapide</h3>
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <p class="text-sm text-gray-700 mb-3">Générer automatiquement toutes les combinaisons</p>
                    <div class="space-y-3">
                        <div>
                            <label class="text-sm font-medium text-gray-700 mb-2 block">Tailles</label>
                            <div class="flex flex-wrap gap-2">
                                <button class="px-3 py-1.5 bg-primary text-white rounded-lg text-sm font-semibold">XS</button>
                                <button class="px-3 py-1.5 bg-primary text-white rounded-lg text-sm font-semibold">S</button>
                                <button class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium">M</button>
                                <button class="px-3 py-1.5 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium">L</button>
                            </div>
                        </div>
                        <div>
                            <label class="text-sm font-medium text-gray-700 mb-2 block">Couleurs</label>
                            <div class="flex flex-wrap gap-2">
                                <button class="w-10 h-10 rounded-lg bg-blue-500 border-2 border-primary"></button>
                                <button class="w-10 h-10 rounded-lg bg-red-500 border-2 border-gray-300"></button>
                                <button class="w-10 h-10 rounded-lg bg-green-500 border-2 border-gray-300"></button>
                            </div>
                        </div>
                        <button class="w-full flex items-center justify-center gap-2 rounded-xl h-10 px-4 bg-primary text-white text-sm font-semibold hover:bg-primary/90 transition-colors">
                            <span>Générer 12 variantes</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
