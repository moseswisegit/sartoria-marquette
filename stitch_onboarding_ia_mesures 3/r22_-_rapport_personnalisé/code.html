<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rapport Personnalisé - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Rapport</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <form class="flex flex-col gap-5" onsubmit="event.preventDefault()">
                <!-- Période -->
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-2 block">Période</label>
                    <div class="flex gap-2">
                        <input type="date" value="2025-01-01"
                            class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <input type="date" value="2025-01-31"
                            class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                    </div>
                </div>

                <!-- Métriques -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-3">Métriques à inclure</h3>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked
                                class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Ventes totales</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked
                                class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Produits vendus</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked
                                class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Taux de conversion</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked
                                class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Panier moyen</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox"
                                class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Top produits</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox"
                                class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Graphiques</span>
                        </label>
                    </div>
                </div>

                <!-- Format -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-3">Format</h3>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="radio" name="format" value="pdf" checked
                                class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                            <div>
                                <p class="font-semibold text-gray-900 text-sm">PDF</p>
                                <p class="text-xs text-gray-600">Document imprimable</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="radio" name="format" value="excel"
                                class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                            <div>
                                <p class="font-semibold text-gray-900 text-sm">Excel</p>
                                <p class="text-xs text-gray-600">Tableur modifiable</p>
                            </div>
                        </label>
                    </div>
                </div>

                <!-- Envoi automatique -->
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <label class="flex items-center justify-between cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900 text-sm">Envoi automatique</p>
                            <p class="text-xs text-gray-600">Recevoir ce rapport par email</p>
                        </div>
                        <input type="checkbox"
                            class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <div class="mt-3">
                        <label class="text-xs text-gray-600 mb-1 block">Fréquence</label>
                        <select class="w-full rounded-lg border border-gray-300 bg-white p-2 text-sm">
                            <option>Mensuel</option>
                            <option>Hebdomadaire</option>
                            <option>Quotidien</option>
                        </select>
                    </div>
                </div>

                <button type="submit"
                    class="w-full mt-4 flex items-center justify-center gap-2 rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-xl">description</span>
                    <span>Générer le rapport</span>
                </button>
            </form>
        </div>
    </div>
</body>

</html>
