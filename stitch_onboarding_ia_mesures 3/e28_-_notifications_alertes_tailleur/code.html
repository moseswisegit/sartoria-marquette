<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Notifications Tailleur - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Notifications</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Types de notifications</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Nouvelles commandes</p>
                            <p class="text-xs text-gray-600">Notifications pour chaque nouvelle commande</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Messages clients</p>
                            <p class="text-xs text-gray-600">Nouveaux messages des clients</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Paiements reçus</p>
                            <p class="text-xs text-gray-600">Confirmation de paiement</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Alertes urgentes</p>
                            <p class="text-xs text-gray-600">Commandes avec délais serrés</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Nouveaux avis</p>
                            <p class="text-xs text-gray-600">Avis clients publiés</p>
                        </div>
                        <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                </div>
            </div>
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Canaux</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Notifications push</p>
                            <p class="text-xs text-gray-600">Sur votre appareil</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Email</p>
                            <p class="text-xs text-gray-600">tailleur@email.com</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">SMS</p>
                            <p class="text-xs text-gray-600">+229 XX XX XX XX</p>
                        </div>
                        <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                </div>
            </div>
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Alertes urgentes</h3>
                <div class="p-4 bg-orange-50 border border-orange-200 rounded-xl">
                    <div class="flex items-center gap-3 mb-3">
                        <span class="material-symbols-outlined text-orange-600 text-xl">warning</span>
                        <p class="font-semibold text-orange-900">Seuil d'alerte</p>
                    </div>
                    <div class="space-y-2">
                        <div class="flex items-center justify-between">
                            <span class="text-sm text-gray-700">Jours restants avant alerte</span>
                            <input type="number" value="3" min="1" max="7" class="w-20 rounded-lg border border-gray-300 bg-white p-2 text-center text-sm font-semibold" />
                        </div>
                        <p class="text-xs text-orange-700">Vous serez alerté si une commande a moins de 3 jours restants</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
