<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestion Collections - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Collections</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-900 font-bold text-lg">Mes collections</h3>
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-lg">add</span>
                    <span>Créer</span>
                </button>
            </div>

            <!-- Liste Collections -->
            <div class="space-y-3">
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-20 h-20 rounded-lg bg-gray-200 bg-cover bg-center"
                            style='background-image: url("https://via.placeholder.com/80");'></div>
                        <div class="flex-1">
                            <p class="font-bold text-gray-900">Collection Printemps 2025</p>
                            <p class="text-xs text-gray-600">12 produits</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span
                                    class="px-2 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded">Publique</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-gray-700 mb-3">Collection de robes et accessoires pour le printemps avec des
                        couleurs vives et des motifs floraux.</p>
                    <div class="flex gap-2">
                        <button
                            class="flex-1 px-3 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-colors">
                            Modifier
                        </button>
                        <button
                            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                            Produits
                        </button>
                    </div>
                </div>

                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center gap-3 mb-3">
                        <div class="w-20 h-20 rounded-lg bg-gray-200 bg-cover bg-center"
                            style='background-image: url("https://via.placeholder.com/80");'></div>
                        <div class="flex-1">
                            <p class="font-bold text-gray-900">Collection Élégance</p>
                            <p class="text-xs text-gray-600">8 produits</p>
                            <div class="flex items-center gap-2 mt-1">
                                <span
                                    class="px-2 py-1 bg-gray-100 text-gray-700 text-xs font-semibold rounded">Privée</span>
                            </div>
                        </div>
                    </div>
                    <p class="text-sm text-gray-700 mb-3">Collection premium pour occasions spéciales.</p>
                    <div class="flex gap-2">
                        <button
                            class="flex-1 px-3 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-colors">
                            Modifier
                        </button>
                        <button
                            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                            Produits
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
