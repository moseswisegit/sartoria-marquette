<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Communication Globale - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Communication</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            
            <form class="flex flex-col gap-5" onsubmit="event.preventDefault()">
                <!-- Destinataires -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-4">Destinataires</h3>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Tous les utilisateurs</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Clients uniquement</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Tailleurs uniquement</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Revendeurs uniquement</span>
                        </label>
                    </div>
                </div>
                
                <!-- Type de message -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-4">Type de message</h3>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="radio" name="message_type" value="announcement" checked class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                            <div>
                                <p class="font-semibold text-gray-900 text-sm">Annonce</p>
                                <p class="text-xs text-gray-600">Information générale</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="radio" name="message_type" value="maintenance" class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                            <div>
                                <p class="font-semibold text-gray-900 text-sm">Maintenance</p>
                                <p class="text-xs text-gray-600">Alerte maintenance</p>
                            </div>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="radio" name="message_type" value="promotion" class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                            <div>
                                <p class="font-semibold text-gray-900 text-sm">Promotion</p>
                                <p class="text-xs text-gray-600">Offre spéciale</p>
                            </div>
                        </label>
                    </div>
                </div>
                
                <!-- Contenu -->
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-2 block">Titre</label>
                    <input type="text" placeholder="Titre du message" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                </div>
                
                <div>
                    <label class="text-sm font-medium text-gray-700 mb-2 block">Message</label>
                    <textarea rows="5" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="Contenu du message..."></textarea>
                </div>
                
                <!-- Canaux -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-4">Canaux</h3>
                    <div class="space-y-2">
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Notifications push</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">Email</span>
                        </label>
                        <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                            <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                            <span class="font-semibold text-gray-900 text-sm">SMS</span>
                        </label>
                    </div>
                </div>
                
                <!-- Planification -->
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <label class="flex items-center justify-between cursor-pointer mb-3">
                        <div>
                            <p class="font-semibold text-gray-900 text-sm">Envoyer maintenant</p>
                            <p class="text-xs text-gray-600">Ou planifier l'envoi</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <div>
                        <label class="text-xs text-gray-600 mb-1 block">Date et heure</label>
                        <input type="datetime-local" class="w-full rounded-lg border border-gray-300 bg-white p-2 text-sm" />
                </div>
            </div>
                
                <button type="submit" class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                    <span>Envoyer le message</span>
                </button>
            </form>
            
        </div>
    </div>
</body>
</html>
