<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Dashboard Personnalisable - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Dashboard</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-900 font-bold text-lg">Personnalisation</h3>
                <button class="px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold hover:bg-primary/90 transition-colors">
                    <span>Mode édition</span>
                </button>
            </div>
            
            <!-- Widgets Disponibles -->
            <div>
                <h3 class="text-gray-900 font-bold mb-3">Widgets disponibles</h3>
                <div class="space-y-2">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary text-xl">bar_chart</span>
                            <span class="font-semibold text-gray-900 text-sm">Graphique revenus</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer" />
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary text-xl">people</span>
                            <span class="font-semibold text-gray-900 text-sm">Statistiques utilisateurs</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer" />
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary text-xl">shopping_cart</span>
                            <span class="font-semibold text-gray-900 text-sm">Commandes récentes</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer" />
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary text-xl">trending_up</span>
                            <span class="font-semibold text-gray-900 text-sm">Tendances</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" />
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-primary text-xl">notifications</span>
                            <span class="font-semibold text-gray-900 text-sm">Alertes système</span>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer" />
                            <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                        </label>
                    </div>
                </div>
            </div>
            
            <!-- Ordre d'affichage -->
            <div>
                <h3 class="text-gray-900 font-bold mb-3">Ordre d'affichage</h3>
                <div class="space-y-2">
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-gray-400 text-xl">drag_handle</span>
                            <span class="font-semibold text-gray-900 text-sm">Graphique revenus</span>
                        </div>
                        <div class="flex gap-2">
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">arrow_upward</span>
                            </button>
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">arrow_downward</span>
                            </button>
                        </div>
                    </div>
                    <div class="flex items-center justify-between p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="material-symbols-outlined text-gray-400 text-xl">drag_handle</span>
                            <span class="font-semibold text-gray-900 text-sm">Statistiques utilisateurs</span>
                        </div>
                        <div class="flex gap-2">
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">arrow_upward</span>
                            </button>
                            <button class="text-gray-600 hover:text-gray-900">
                                <span class="material-symbols-outlined text-xl">arrow_downward</span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <button class="w-full mt-4 flex items-center justify-center rounded-xl h-12 px-5 bg-primary text-white text-base font-semibold hover:bg-primary/90 transition-colors">
                <span>Enregistrer la configuration</span>
            </button>
        </div>
    </div>
</body>
</html>
