<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Favoris / Wishlist - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Mes favoris</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Filtres -->
            <div class="flex gap-2 overflow-x-auto pb-2">
                <button
                    class="px-4 py-2 rounded-full bg-primary text-white text-sm font-semibold whitespace-nowrap">Tous
                    (12)</button>
                <button
                    class="px-4 py-2 rounded-full bg-gray-100 text-gray-700 text-sm font-medium whitespace-nowrap">Vêtements
                    (8)</button>
                <button
                    class="px-4 py-2 rounded-full bg-gray-100 text-gray-700 text-sm font-medium whitespace-nowrap">Accessoires
                    (4)</button>
            </div>

            <!-- Liste Produits -->
            <div class="grid grid-cols-2 gap-3">
                <div class="relative">
                    <div class="aspect-square bg-gray-100 rounded-xl mb-2 bg-cover bg-center relative"
                        style='background-image: url("https://via.placeholder.com/200");'>
                        <button
                            class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white shadow-lg flex items-center justify-center text-red-500 hover:bg-red-50 transition-colors">
                            <span class="material-symbols-outlined text-lg">favorite</span>
                        </button>
                    </div>
                    <p class="text-sm font-semibold text-gray-900 mb-1">Robe élégante</p>
                    <p class="text-xs text-gray-600 mb-1">Boutique Mode</p>
                    <p class="text-base font-bold text-primary">25,000 FCFA</p>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="material-symbols-outlined text-yellow-500 text-xs">star</span>
                        <span class="text-xs text-gray-600">4.5</span>
                    </div>
                </div>

                <div class="relative">
                    <div class="aspect-square bg-gray-100 rounded-xl mb-2 bg-cover bg-center relative"
                        style='background-image: url("https://via.placeholder.com/200");'>
                        <button
                            class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white shadow-lg flex items-center justify-center text-red-500 hover:bg-red-50 transition-colors">
                            <span class="material-symbols-outlined text-lg">favorite</span>
                        </button>
                    </div>
                    <p class="text-sm font-semibold text-gray-900 mb-1">Sac à main</p>
                    <p class="text-xs text-gray-600 mb-1">Fashion Store</p>
                    <p class="text-base font-bold text-primary">18,000 FCFA</p>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="material-symbols-outlined text-yellow-500 text-xs">star</span>
                        <span class="text-xs text-gray-600">4.8</span>
                    </div>
                </div>

                <div class="relative">
                    <div class="aspect-square bg-gray-100 rounded-xl mb-2 bg-cover bg-center relative"
                        style='background-image: url("https://via.placeholder.com/200");'>
                        <button
                            class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white shadow-lg flex items-center justify-center text-red-500 hover:bg-red-50 transition-colors">
                            <span class="material-symbols-outlined text-lg">favorite</span>
                        </button>
                    </div>
                    <p class="text-sm font-semibold text-gray-900 mb-1">Chaussures</p>
                    <p class="text-xs text-gray-600 mb-1">Shoe Shop</p>
                    <p class="text-base font-bold text-primary">35,000 FCFA</p>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="material-symbols-outlined text-yellow-500 text-xs">star</span>
                        <span class="text-xs text-gray-600">4.2</span>
                    </div>
                </div>

                <div class="relative">
                    <div class="aspect-square bg-gray-100 rounded-xl mb-2 bg-cover bg-center relative"
                        style='background-image: url("https://via.placeholder.com/200");'>
                        <button
                            class="absolute top-2 right-2 w-8 h-8 rounded-full bg-white shadow-lg flex items-center justify-center text-red-500 hover:bg-red-50 transition-colors">
                            <span class="material-symbols-outlined text-lg">favorite</span>
                        </button>
                    </div>
                    <p class="text-sm font-semibold text-gray-900 mb-1">Écharpe</p>
                    <p class="text-xs text-gray-600 mb-1">Accessoires Plus</p>
                    <p class="text-base font-bold text-primary">12,000 FCFA</p>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="material-symbols-outlined text-yellow-500 text-xs">star</span>
                        <span class="text-xs text-gray-600">4.7</span>
                    </div>
                </div>
            </div>

            <!-- Actions -->
            <div class="pt-4 border-t border-gray-200">
                <button
                    class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-primary text-white text-base font-semibold hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-xl">shopping_cart</span>
                    <span>Ajouter tout au panier</span>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
