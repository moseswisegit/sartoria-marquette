<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Intégrations & API - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Intégrations</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- API Key -->
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Clé API</h3>
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <p class="text-xs text-gray-600 mb-2">Votre clé API secrète</p>
                    <div class="flex gap-2">
                        <input type="text" value="sk_live_1234567890abcdef" readonly
                            class="flex-1 rounded-lg border border-gray-300 bg-white p-3 text-sm font-mono text-gray-600" />
                        <button
                            class="px-4 py-3 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-colors">
                            <span class="material-symbols-outlined text-lg">content_copy</span>
                        </button>
                    </div>
                    <p class="text-xs text-gray-600 mt-2">⚠️ Ne partagez jamais cette clé. Elle donne accès à votre
                        compte.</p>
                    <button class="w-full mt-3 text-sm text-red-600 hover:text-red-700 font-medium">Régénérer la
                        clé</button>
                </div>
            </div>

            <!-- Intégrations Disponibles -->
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Intégrations disponibles</h3>
                <div class="space-y-2">
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">📦</span>
                            <div>
                                <p class="font-semibold text-gray-900">WooCommerce</p>
                                <p class="text-xs text-gray-600">Synchronisation produits</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" />
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                            </div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">📊</span>
                            <div>
                                <p class="font-semibold text-gray-900">Google Analytics</p>
                                <p class="text-xs text-gray-600">Suivi des performances</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" checked class="sr-only peer" />
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                            </div>
                        </label>
                    </div>
                    <div class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center gap-3">
                            <span class="text-2xl">📧</span>
                            <div>
                                <p class="font-semibold text-gray-900">Mailchimp</p>
                                <p class="text-xs text-gray-600">Email marketing</p>
                            </div>
                        </div>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" class="sr-only peer" />
                            <div
                                class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary">
                            </div>
                        </label>
                    </div>
                </div>
            </div>

            <!-- Documentation -->
            <div class="pt-4 border-t border-gray-200">
                <button
                    class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-white border-2 border-primary text-primary text-base font-semibold hover:bg-primary/5 transition-colors">
                    <span class="material-symbols-outlined text-xl">menu_book</span>
                    <span>Voir la documentation API</span>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
