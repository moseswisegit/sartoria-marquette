<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>R05 - Formulaire Ajout Produit</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#3211d4",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Inter"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>.material-symbols-outlined {
    font-variation-settings: "FILL" 0, "wght" 400, "GRAD" 0, "opsz" 24
    }
.ios-switch:checked + .ios-switch-dot {
    transform: translatex(1.25rem);
    background-color: white
    }
.ios-switch:checked {
    background-color: #3211d4
    }
/* Custom select styling for the category dropdown */
select {
    appearance: none;
    background-image: url(https://lh3.googleusercontent.com/aida-public/AB6AXuCrNGJuXfJMSTDeigBcC7ilhxRoG6cX18loVDMwD2NSYYmqQiHXtMYLLhOEySZAsKi757v1oYPVQkzzqsQk3AUebiZIMoFNQXTJp3i2ZjhqdJUaLiuZJxz6JJbRW92URE4pIX6KiZMMc4O2KOQozEjrshNthPXmTnVFH9YS-L_YVUtgJeiNQrFuuLDBsMKjHbO-uAvlDuC2NM6c4HCMQlstAIw0Q00Jm63PZNVfRGi16Pq9a25rjl_4vs2Jd9Ikr1mhzHxxSnUcD9zA);
    background-position: right 0.5rem center;
    background-repeat: no-repeat;
    background-size: 1.5em 1.5em;
    padding-right: 2.5rem
    }</style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-lightbg-background-dark font-display text-[#121118]text-white min-h-screen">
<!-- Top Navigation Bar -->
<header class="sticky top-0 z-50 bg-white/80bg-background-dark/80 backdrop-blur-md border-b border-gray-200border-gray-800">
<div class="flex items-center justify-between p-4">
<button class="text-primary font-medium text-base">Annuler</button>
<h1 class="text-lg font-bold tracking-tight">Nouveau Produit</h1>
<button class="text-primary font-bold text-base">Enregistrer</button>
</div>
</header>
<main class="max-w-md mx-auto pb-24">
<!-- Media Upload Section -->
<section class="p-4">
<div class="flex flex-col items-center gap-4 rounded-xl border-2 border-dashed border-gray-300border-gray-700 bg-whitebg-gray-900 px-6 py-10 transition-colors hover:border-primary">
<div class="flex flex-col items-center gap-2">
<span class="material-symbols-outlined text-4xl text-gray-400text-gray-500 mb-2">add_a_photo</span>
<p class="text-lg font-bold leading-tight text-center">Photos du produit</p>
<p class="text-sm text-gray-500text-gray-400 text-center">Glissez vos images ici ou cliquez pour uploader</p>
</div>
<button class="mt-2 flex items-center justify-center rounded-lg h-11 px-6 bg-primary text-white text-sm font-bold tracking-wide shadow-lg shadow-primary/20">
<span class="truncate">Ajouter des photos</span>
</button>
</div>
</section>
<!-- General Information -->
<section class="space-y-1">
<h3 class="text-sm font-bold uppercase tracking-wider text-gray-500text-gray-400 px-4 pt-6 pb-2">Informations générales</h3>
<div class="bg-whitebg-gray-900 border-y border-gray-200border-gray-800">
<!-- Product Name -->
<div class="px-4 py-3 border-b border-gray-100border-gray-800">
<label class="flex flex-col">
<span class="text-xs font-semibold text-gray-500text-gray-400 uppercase pb-1">Nom du produit</span>
<input class="w-full border-none p-0 bg-transparent text-[#121118]text-white placeholder:text-gray-400 focus:ring-0 text-base" placeholder="Ex: Robe en soie fleurie" type="text"/>
</label>
</div>
<!-- Category Selection -->
<div class="px-4 py-3">
<label class="flex flex-col">
<span class="text-xs font-semibold text-gray-500text-gray-400 uppercase pb-1">Catégorie</span>
<select class="w-full border-none p-0 bg-transparent text-[#121118]text-white focus:ring-0 text-base appearance-none">
<option disabled="" selected="" value="">Choisir une catégorie</option>
<option value="tissus">Tissus</option>
<option value="pret-a-porter">Prêt-à-porter</option>
<option value="accessoires">Accessoires</option>
</select>
</label>
</div>
</div>
</section>
<!-- Inventory & Pricing -->
<section class="space-y-1">
<h3 class="text-sm font-bold uppercase tracking-wider text-gray-500text-gray-400 px-4 pt-8 pb-2">Prix &amp; Stock</h3>
<div class="bg-whitebg-gray-900 border-y border-gray-200border-gray-800">
<div class="flex divide-x divide-gray-100divide-gray-800">
<!-- Price -->
<div class="flex-1 px-4 py-3">
<label class="flex flex-col">
<span class="text-xs font-semibold text-gray-500text-gray-400 uppercase pb-1">Prix (€)</span>
<input class="w-full border-none p-0 bg-transparent text-[#121118]text-white placeholder:text-gray-400 focus:ring-0 text-base" placeholder="0.00" step="0.01" type="number"/>
</label>
</div>
<!-- Stock -->
<div class="flex-1 px-4 py-3">
<label class="flex flex-col">
<span class="text-xs font-semibold text-gray-500text-gray-400 uppercase pb-1">Stock initial</span>
<div class="flex items-center">
<input class="w-full border-none p-0 bg-transparent text-[#121118]text-white placeholder:text-gray-400 focus:ring-0 text-base" placeholder="0" type="number"/>
<span class="text-gray-400 text-sm ml-1">unités</span>
</div>
</label>
</div>
</div>
</div>
</section>
<!-- Visibility Switch -->
<section class="px-4 pt-8">
<div class="flex items-center justify-between p-4 bg-whitebg-gray-900 rounded-xl border border-gray-200border-gray-800">
<div class="flex flex-col">
<span class="text-base font-bold">Visibilité du produit</span>
<span class="text-sm text-gray-500text-gray-400 leading-tight">Rendre visible immédiatement sur la boutique</span>
</div>
<!-- iOS Style Toggle Switch -->
<label class="relative inline-flex items-center cursor-pointer">
<input checked="" class="sr-only peer" type="checkbox"/>
<div class="w-11 h-6 bg-gray-200 peer-focus:outline-none rounded-full peerbg-gray-700 peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
</label>
</div>
</section>
<!-- Final Action -->
<div class="p-4 mt-6">
<button class="w-full flex items-center justify-center rounded-xl h-14 bg-primary text-white text-base font-bold shadow-xl shadow-primary/30 transition-transform active:scale-[0.98]">
                Créer la fiche produit
            </button>
<p class="text-center text-xs text-gray-400 mt-4 px-6">
                En créant ce produit, vous acceptez nos conditions générales de vente aux revendeurs.
            </p>
</div>
</main>
<!-- Bottom Navigation Spacer (iOS safe area) -->
<div class="h-8"></div>
</body></html>
