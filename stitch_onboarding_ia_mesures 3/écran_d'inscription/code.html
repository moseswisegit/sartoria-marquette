    <script>
        // Fonction globale pour changer de rôle - accessible partout
        window.switchRole = function (role) {
            console.log('🔄 Switch vers:', role);

            // Récupérer tous les éléments
            const clientBtn = document.getElementById('role-client');
            const tailleurBtn = document.getElementById('role-tailleur');
            const revendeurBtn = document.getElementById('role-revendeur');
            const clientFields = document.getElementById('client-fields');
            const tailleurFields = document.getElementById('tailleur-fields');
            const revendeurFields = document.getElementById('revendeur-fields');

            // Classes pour bouton actif
            const activeClasses = ['bg-white', 'bg-gray-100', 'shadow-sm', 'text-primary', 'font-semibold'];
            const inactiveClasses = ['text-gray-500', 'text-gray-600', 'font-medium'];

            // Réinitialiser tous les boutons (style inactif)
            [clientBtn, tailleurBtn, revendeurBtn].forEach(btn => {
                if (btn) {
                    activeClasses.forEach(cls => btn.classList.remove(cls));
                    inactiveClasses.forEach(cls => btn.classList.add(cls));
                }
            });

            // Activer le bouton sélectionné
            let activeBtn = null;
            if (role === 'client') activeBtn = clientBtn;
            else if (role === 'tailleur') activeBtn = tailleurBtn;
            else if (role === 'revendeur') activeBtn = revendeurBtn;

            if (activeBtn) {
                inactiveClasses.forEach(cls => activeBtn.classList.remove(cls));
                activeClasses.forEach(cls => activeBtn.classList.add(cls));
            }

            // Masquer tous les champs
            if (clientFields) clientFields.classList.add('hidden');
            if (tailleurFields) tailleurFields.classList.add('hidden');
            if (revendeurFields) revendeurFields.classList.add('hidden');

            // Afficher les champs du rôle sélectionné
            if (role === 'client' && clientFields) {
                clientFields.classList.remove('hidden');
            } else if (role === 'tailleur' && tailleurFields) {
                tailleurFields.classList.remove('hidden');
            } else if (role === 'revendeur' && revendeurFields) {
                revendeurFields.classList.remove('hidden');
            }

            console.log('✅ Champs affichés pour:', role);
        };

        // Initialisation
        function initTabs() {
            const clientBtn = document.getElementById('role-client');
            const tailleurBtn = document.getElementById('role-tailleur');
            const revendeurBtn = document.getElementById('role-revendeur');

            if (!clientBtn || !tailleurBtn || !revendeurBtn) {
                setTimeout(initTabs, 100);
                return;
            }

            console.log('✅ Boutons trouvés');

            // Ajouter les event listeners avec capture pour être sûr
            clientBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                console.log('👆 Clic sur Client');
                switchRole('client');
            }, true);

            tailleurBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                console.log('👆 Clic sur Tailleur');
                switchRole('tailleur');
            }, true);

            revendeurBtn.addEventListener('click', function (e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                console.log('👆 Clic sur Revendeur');
                switchRole('revendeur');
            }, true);

            // Afficher les champs client par défaut
            const clientFields = document.getElementById('client-fields');
            if (clientFields) {
                clientFields.classList.remove('hidden');
            }

            console.log('✅ Onglets initialisés !');
        }

        // Exécuter quand le DOM est prêt
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', initTabs);
        } else {
            initTabs();
        }

        // Fallback après chargement complet
        window.addEventListener('load', initTabs);
    </script>
