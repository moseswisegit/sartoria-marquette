<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Création Commande - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Nouvelle commande</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <form class="flex flex-col gap-5" onsubmit="event.preventDefault()">
                <!-- Sélection Client -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Client</label>
                    <div class="relative">
                        <input type="text" placeholder="Rechercher un client..." class="w-full rounded-xl border border-gray-300 bg-white p-3.5 pl-12 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <span class="material-symbols-outlined text-gray-400 absolute left-4 top-1/2 -translate-y-1/2 text-xl">search</span>
                    </div>
                    <div class="mt-2 p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <p class="font-semibold text-gray-900">Jean Dupont</p>
                        <p class="text-xs text-gray-600">jean.dupont@email.com • +33 6 12 34 56 78</p>
                    </div>
                </div>
                
                <!-- Type de vêtement -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Type de vêtement</label>
                    <select class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none">
                        <option>Sélectionner un type</option>
                        <option>Costume</option>
                        <option>Robe</option>
                        <option>Boubou</option>
                        <option>Tenue traditionnelle</option>
                        <option>Autre</option>
                    </select>
                </div>
                
                <!-- Mesures -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Mesures (optionnel)</label>
                    <div class="grid grid-cols-2 gap-3">
                        <input type="number" placeholder="Tour poitrine" class="rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <input type="number" placeholder="Tour taille" class="rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <input type="number" placeholder="Tour hanches" class="rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <input type="number" placeholder="Longueur" class="rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                    </div>
                    <button class="text-sm text-primary font-medium hover:underline mt-1">Saisir toutes les mesures</button>
                </div>
                
                <!-- Tissu -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Tissu (depuis stock)</label>
                    <select class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none">
                        <option>Sélectionner un tissu</option>
                        <option>Wax Premium - Bleu</option>
                        <option>Bazin - Blanc</option>
                        <option>Soie - Rouge</option>
                    </select>
                </div>
                
                <!-- Prix -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Prix</label>
                    <div class="relative">
                        <input type="number" placeholder="0" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 pr-16 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <span class="absolute right-4 top-1/2 -translate-y-1/2 text-gray-600 font-medium">FCFA</span>
                    </div>
                </div>
                
                <!-- Date limite -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Date limite de livraison</label>
                    <input type="date" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                </div>
                
                <!-- Notes -->
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Notes</label>
                    <textarea rows="3" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="Instructions spéciales, préférences..."></textarea>
                </div>
                
                <button type="submit" class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                    <span>Créer la commande</span>
                </button>
            </form>
        </div>
    </div>
</body>
</html>
