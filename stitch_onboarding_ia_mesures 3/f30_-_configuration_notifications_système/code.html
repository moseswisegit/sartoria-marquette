<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Notifications Système - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Notifications</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Types de notifications système</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Alertes sécurité</p>
                            <p class="text-xs text-gray-600">Tentatives de connexion suspectes</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Maintenance système</p>
                            <p class="text-xs text-gray-600">Notifications de maintenance planifiée</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Nouveaux utilisateurs</p>
                            <p class="text-xs text-gray-600">Inscriptions importantes</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Problèmes système</p>
                            <p class="text-xs text-gray-600">Erreurs critiques et bugs</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                </div>
            </div>
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Destinataires</h3>
                <div class="space-y-2">
                    <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between">
                            <div>
                                <p class="font-semibold text-gray-900 text-sm">admin@couturioshop.com</p>
                                <p class="text-xs text-gray-600">Email principal</p>
                            </div>
                            <label class="relative inline-flex items-center cursor-pointer">
                                <input type="checkbox" checked class="sr-only peer" />
                                <div class="w-11 h-6 bg-gray-200 peer-focus:outline-none peer-focus:ring-4 peer-focus:ring-primary/20 rounded-full peer peer-checked:after:translate-x-full peer-checked:after:border-white after:content-[''] after:absolute after:top-[2px] after:left-[2px] after:bg-white after:border-gray-300 after:border after:rounded-full after:h-5 after:w-5 after:transition-all peer-checked:bg-primary"></div>
                            </label>
                        </div>
                    </div>
                    <button class="w-full flex items-center justify-center gap-2 rounded-xl h-10 px-4 bg-white border-2 border-primary text-primary text-sm font-semibold hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-lg">add</span>
                        <span>Ajouter un destinataire</span>
                    </button>
                </div>
            </div>
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Seuils d'alerte</h3>
                <div class="space-y-3">
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-gray-700">Seuil erreurs critiques</label>
                        <input type="number" value="10" min="1" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <p class="text-xs text-gray-600">Alerte si plus de 10 erreurs par heure</p>
                    </div>
                    <div class="flex flex-col gap-2">
                        <label class="text-sm font-medium text-gray-700">Seuil utilisateurs simultanés</label>
                        <input type="number" value="5000" min="1" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <p class="text-xs text-gray-600">Alerte si plus de 5000 utilisateurs connectés</p>
                    </div>
                </div>
            </div>
            
            <button class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                <span>Enregistrer la configuration</span>
            </button>
            
        </div>
    </div>
</body>
</html>
