<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Bannissement & Suspension - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Bannissement</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Utilisateur -->
            <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                <div class="flex items-center gap-3 mb-3">
                    <div class="w-12 h-12 rounded-full bg-primary/20 flex items-center justify-center">
                        <span class="text-lg font-bold text-primary">JD</span>
                    </div>
                    <div class="flex-1">
                        <p class="font-bold text-gray-900">Jean Dupont</p>
                        <p class="text-xs text-gray-600">jean.dupont@email.com • Client</p>
                    </div>
                </div>
            </div>

            <!-- Action -->
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Action</h3>
                <div class="space-y-2">
                    <label
                        class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <input type="radio" name="action" value="suspend"
                            class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                        <div>
                            <p class="font-semibold text-gray-900 text-sm">Suspension temporaire</p>
                            <p class="text-xs text-gray-600">Désactiver l'accès pour une durée limitée</p>
                        </div>
                    </label>
                    <label
                        class="flex items-center gap-3 p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <input type="radio" name="action" value="ban"
                            class="h-5 w-5 text-primary border-gray-300 focus:ring-primary" />
                        <div>
                            <p class="font-semibold text-gray-900 text-sm">Bannissement permanent</p>
                            <p class="text-xs text-gray-600">Désactiver l'accès définitivement</p>
                        </div>
                    </label>
                </div>
            </div>

            <!-- Durée (si suspension) -->
            <div>
                <label class="text-sm font-medium text-gray-700 mb-2 block">Durée de suspension</label>
                <div class="flex gap-2">
                    <input type="number" placeholder="7" min="1"
                        class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                    <select
                        class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none">
                        <option>Jours</option>
                        <option>Semaines</option>
                        <option>Mois</option>
                    </select>
                </div>
            </div>

            <!-- Raison -->
            <div>
                <label class="text-sm font-medium text-gray-700 mb-2 block">Raison</label>
                <select
                    class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none">
                    <option>Sélectionner une raison</option>
                    <option>Violation des conditions d'utilisation</option>
                    <option>Comportement frauduleux</option>
                    <option>Spam ou harcèlement</option>
                    <option>Contenu inapproprié</option>
                    <option>Autre</option>
                </select>
            </div>

            <!-- Description -->
            <div>
                <label class="text-sm font-medium text-gray-700 mb-2 block">Description détaillée</label>
                <textarea rows="4"
                    class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none"
                    placeholder="Détails de la raison du bannissement/suspension..."></textarea>
            </div>

            <!-- Notification -->
            <div class="p-4 bg-blue-50 border border-blue-200 rounded-xl">
                <label class="flex items-center gap-3 cursor-pointer">
                    <input type="checkbox" checked
                        class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    <div>
                        <p class="font-semibold text-blue-900 text-sm">Notifier l'utilisateur</p>
                        <p class="text-xs text-blue-800">Envoyer un email expliquant la raison</p>
                    </div>
                </label>
            </div>

            <button
                class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-red-600 text-white text-base font-bold shadow-lg shadow-red-600/20 hover:bg-red-700 transition-colors">
                <span>Confirmer l'action</span>
            </button>
        </div>
    </div>
</body>

</html>
