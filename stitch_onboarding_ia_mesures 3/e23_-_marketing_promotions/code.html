<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Marketing Promotions - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Promotions</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-900 font-bold text-lg">Mes promotions</h3>
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-lg">add</span>
                    <span>Créer</span>
                </button>
            </div>

            <!-- Promotions Actives -->
            <div>
                <h4 class="text-gray-900 font-semibold mb-3">Promotions actives</h4>
                <div class="space-y-3">
                    <div class="p-4 bg-gradient-to-br from-primary/10 to-primary/5 rounded-xl border-2 border-primary">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="font-bold text-gray-900">-20% sur tous les costumes</p>
                                <p class="text-xs text-gray-600">Du 15 au 31 Jan 2025</p>
                            </div>
                            <span
                                class="px-2 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded">Active</span>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <button class="flex-1 text-sm text-primary hover:underline font-medium">Modifier</button>
                            <button class="text-sm text-red-600 hover:underline font-medium">Désactiver</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Promotions Planifiées -->
            <div>
                <h4 class="text-gray-900 font-semibold mb-3">Promotions planifiées</h4>
                <div class="space-y-3">
                    <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between mb-2">
                            <div>
                                <p class="font-bold text-gray-900">-15% sur les robes</p>
                                <p class="text-xs text-gray-600">Du 1er au 14 Fév 2025</p>
                            </div>
                            <span
                                class="px-2 py-1 bg-blue-100 text-blue-700 text-xs font-semibold rounded">Planifiée</span>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <button class="flex-1 text-sm text-primary hover:underline font-medium">Modifier</button>
                            <button class="text-sm text-red-600 hover:underline font-medium">Annuler</button>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Statistiques -->
            <div class="pt-4 border-t border-gray-200">
                <h4 class="text-gray-900 font-semibold mb-3">Impact des promotions</h4>
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-xl font-bold text-primary">+35%</p>
                        <p class="text-xs text-gray-600">Commandes</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-xl font-bold text-primary">+28%</p>
                        <p class="text-xs text-gray-600">Revenus</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
