<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Filtres Avancés Produits - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Filtres</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Prix</h3>
                <div class="space-y-3">
                    <div class="flex gap-3">
                        <input type="number" placeholder="Min"
                            class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                        <input type="number" placeholder="Max"
                            class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                    </div>
                </div>
            </div>

            <div>
                <h3 class="text-gray-900 font-bold mb-4">Catégories</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox"
                            class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-medium text-gray-900">Vêtements</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox"
                            class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-medium text-gray-900">Accessoires</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox"
                            class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-medium text-gray-900">Chaussures</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox"
                            class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-medium text-gray-900">Sacs</span>
                    </label>
                </div>
            </div>

            <div>
                <h3 class="text-gray-900 font-bold mb-4">Taille</h3>
                <div class="flex flex-wrap gap-2">
                    <button
                        class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium hover:bg-primary hover:text-white transition-colors">XS</button>
                    <button class="px-4 py-2 rounded-xl bg-primary text-white text-sm font-medium">S</button>
                    <button
                        class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium hover:bg-primary hover:text-white transition-colors">M</button>
                    <button
                        class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium hover:bg-primary hover:text-white transition-colors">L</button>
                    <button
                        class="px-4 py-2 rounded-xl bg-gray-100 text-gray-700 text-sm font-medium hover:bg-primary hover:text-white transition-colors">XL</button>
                </div>
            </div>

            <div>
                <h3 class="text-gray-900 font-bold mb-4">Couleur</h3>
                <div class="flex flex-wrap gap-3">
                    <button
                        class="w-12 h-12 rounded-full bg-black border-2 border-gray-300 hover:border-primary transition-colors"></button>
                    <button
                        class="w-12 h-12 rounded-full bg-white border-2 border-gray-300 hover:border-primary transition-colors"></button>
                    <button
                        class="w-12 h-12 rounded-full bg-red-500 border-2 border-gray-300 hover:border-primary transition-colors"></button>
                    <button
                        class="w-12 h-12 rounded-full bg-blue-500 border-2 border-gray-300 hover:border-primary transition-colors"></button>
                    <button
                        class="w-12 h-12 rounded-full bg-green-500 border-2 border-gray-300 hover:border-primary transition-colors"></button>
                </div>
            </div>

            <div>
                <h3 class="text-gray-900 font-bold mb-4">Note minimale</h3>
                <div class="flex items-center gap-2">
                    <input type="range" min="1" max="5" value="4" step="0.5" class="flex-1" />
                    <span class="text-lg font-bold text-primary">4.0</span>
                </div>
            </div>

            <div class="flex gap-3 pt-4 border-t border-gray-200">
                <button
                    class="flex-1 flex items-center justify-center rounded-xl h-12 px-5 bg-gray-100 text-gray-700 text-base font-semibold hover:bg-gray-200 transition-colors">
                    <span>Réinitialiser</span>
                </button>
                <button
                    class="flex-1 flex items-center justify-center rounded-xl h-12 px-5 bg-primary text-white text-base font-semibold hover:bg-primary/90 transition-colors">
                    <span>Appliquer</span>
                </button>
            </div>
        </div>
    </div>
</body>

</html>
