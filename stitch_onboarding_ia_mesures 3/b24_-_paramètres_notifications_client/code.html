<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Paramètres Notifications - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Notifications</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Types de notifications</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Commandes</p>
                            <p class="text-xs text-gray-600">Statut, livraison, confirmations</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Messages</p>
                            <p class="text-xs text-gray-600">Nouveaux messages des tailleurs/revendeurs</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Promotions</p>
                            <p class="text-xs text-gray-600">Offres spéciales et réductions</p>
                        </div>
                        <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                </div>
            </div>
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Canaux</h3>
                <div class="space-y-3">
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Notifications push</p>
                            <p class="text-xs text-gray-600">Sur votre appareil</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">Email</p>
                            <p class="text-xs text-gray-600">jean.dupont@email.com</p>
                        </div>
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                    <label class="flex items-center justify-between p-4 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer">
                        <div>
                            <p class="font-semibold text-gray-900">SMS</p>
                            <p class="text-xs text-gray-600">+33 6 12 34 56 78</p>
                        </div>
                        <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </label>
                </div>
            </div>
            
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Heures silencieuses</h3>
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-3">
                        <p class="font-semibold text-gray-900">Activer</p>
                        <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                    </div>
                    <div class="flex gap-3 mt-3">
                        <input type="time" value="22:00" class="flex-1 rounded-lg border border-gray-300 bg-white p-2 text-sm" />
                        <span class="text-gray-600 self-center">à</span>
                        <input type="time" value="08:00" class="flex-1 rounded-lg border border-gray-300 bg-white p-2 text-sm" />
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
