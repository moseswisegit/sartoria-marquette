<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Notation Produit - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Noter le produit</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Produit -->
            <div class="flex gap-3 p-4 bg-gray-50 rounded-xl border border-gray-200">
                <div class="w-20 h-20 rounded-lg bg-gray-200 bg-cover bg-center" style='background-image: url("https://via.placeholder.com/80");'></div>
                <div class="flex-1">
                    <p class="font-semibold text-gray-900">Robe élégante</p>
                    <p class="text-sm text-gray-600">Boutique Mode</p>
                    <p class="text-sm font-semibold text-primary mt-1">25,000 FCFA</p>
                </div>
            </div>
            
            <!-- Note Globale -->
            <div>
                <p class="text-sm font-medium text-gray-700 mb-3">Note globale</p>
                <div class="flex gap-2 justify-center">
                    <button class="text-4xl text-yellow-400 hover:text-yellow-500 transition-colors">★</button>
                    <button class="text-4xl text-yellow-400 hover:text-yellow-500 transition-colors">★</button>
                    <button class="text-4xl text-yellow-400 hover:text-yellow-500 transition-colors">★</button>
                    <button class="text-4xl text-yellow-400 hover:text-yellow-500 transition-colors">★</button>
                    <button class="text-4xl text-gray-300 hover:text-yellow-400 transition-colors">★</button>
                </div>
                <p class="text-center text-sm text-gray-600 mt-2">4 étoiles</p>
            </div>
            
            <!-- Critères -->
            <div>
                <p class="text-sm font-medium text-gray-700 mb-3">Détails</p>
                <div class="space-y-3">
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="text-sm text-gray-600">Qualité</span>
                            <span class="text-sm font-semibold text-gray-900">4/5</span>
                        </div>
                        <div class="flex gap-1">
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-gray-300">★</span>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="text-sm text-gray-600">Conforme à la description</span>
                            <span class="text-sm font-semibold text-gray-900">5/5</span>
                        </div>
                        <div class="flex gap-1">
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                        </div>
                    </div>
                    <div>
                        <div class="flex justify-between mb-1">
                            <span class="text-sm text-gray-600">Livraison</span>
                            <span class="text-sm font-semibold text-gray-900">4/5</span>
                        </div>
                        <div class="flex gap-1">
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-yellow-400">★</span>
                            <span class="text-lg text-gray-300">★</span>
                        </div>
                    </div>
                </div>
            </div>
            
            <!-- Commentaire -->
            <div>
                <label class="text-sm font-medium text-gray-700 mb-2 block">Votre avis</label>
                <textarea rows="4" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none" placeholder="Partagez votre expérience avec ce produit..."></textarea>
            </div>
            
            <!-- Photos -->
            <div>
                <label class="text-sm font-medium text-gray-700 mb-2 block">Photos (optionnel)</label>
                <div class="flex gap-3">
                    <div class="w-20 h-20 rounded-xl bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center">
                        <span class="material-symbols-outlined text-gray-400 text-2xl">add_a_photo</span>
                    </div>
                </div>
            </div>
            
            <!-- Recommandation -->
            <div>
                <p class="text-sm font-medium text-gray-700 mb-3">Recommanderiez-vous ce produit ?</p>
                <div class="flex gap-3">
                    <button class="flex-1 px-4 py-3 rounded-xl bg-green-50 border-2 border-green-500 text-green-700 font-semibold hover:bg-green-100 transition-colors">
                        Oui
                    </button>
                    <button class="flex-1 px-4 py-3 rounded-xl bg-gray-50 border-2 border-gray-200 text-gray-700 font-semibold hover:bg-gray-100 transition-colors">
                        Non
                    </button>
                </div>
            </div>
            
            <button class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                <span>Publier l'avis</span>
            </button>
        </div>
    </div>
</body>
</html>
