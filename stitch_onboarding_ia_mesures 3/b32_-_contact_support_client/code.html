<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Contact Support - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Support</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <form class="flex flex-col gap-5" onsubmit="event.preventDefault()">
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Sujet</label>
                    <select
                        class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none">
                        <option>Sélectionner un sujet</option>
                        <option>Problème avec une commande</option>
                        <option>Question sur un produit</option>
                        <option>Problème de paiement</option>
                        <option>Retour / Remboursement</option>
                        <option>Problème technique</option>
                        <option>Autre</option>
                    </select>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Description du problème</label>
                    <textarea rows="5"
                        class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none resize-none"
                        placeholder="Décrivez votre problème en détail..."></textarea>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Numéro de commande (si applicable)</label>
                    <input type="text" placeholder="Ex: CMD-2025-001234"
                        class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Pièces jointes (optionnel)</label>
                    <div class="flex gap-3">
                        <div
                            class="w-20 h-20 rounded-xl bg-gray-100 border-2 border-dashed border-gray-300 flex items-center justify-center">
                            <span class="material-symbols-outlined text-gray-400 text-2xl">add_a_photo</span>
                        </div>
                    </div>
                    <p class="text-xs text-gray-600">Ajoutez des captures d'écran ou photos (max 3 fichiers)</p>
                </div>

                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Priorité</label>
                    <div class="flex gap-3">
                        <label
                            class="flex-1 p-3 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer hover:border-primary transition-colors">
                            <input type="radio" name="priority" value="low" class="mr-2" />
                            <span class="text-sm font-medium text-gray-900">Basse</span>
                        </label>
                        <label
                            class="flex-1 p-3 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer hover:border-primary transition-colors">
                            <input type="radio" name="priority" value="medium" checked class="mr-2" />
                            <span class="text-sm font-medium text-gray-900">Normale</span>
                        </label>
                        <label
                            class="flex-1 p-3 bg-gray-50 rounded-xl border border-gray-200 cursor-pointer hover:border-primary transition-colors">
                            <input type="radio" name="priority" value="high" class="mr-2" />
                            <span class="text-sm font-medium text-gray-900">Urgente</span>
                        </label>
                    </div>
                </div>

                <button type="submit"
                    class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                    <span>Envoyer le ticket</span>
                </button>
            </form>

            <!-- Contact rapide -->
            <div class="pt-4 border-t border-gray-200">
                <p class="text-sm font-medium text-gray-700 mb-3">Contact rapide</p>
                <div class="space-y-2">
                    <a href="tel:+22912345678"
                        class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl border border-gray-200 hover:border-primary hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-primary text-xl">phone</span>
                        <div>
                            <p class="font-semibold text-gray-900">Téléphone</p>
                            <p class="text-xs text-gray-600">+229 XX XX XX XX</p>
                        </div>
                    </a>
                    <a href="mailto:support@couturioshop.com"
                        class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl border border-gray-200 hover:border-primary hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-primary text-xl">email</span>
                        <div>
                            <p class="font-semibold text-gray-900">Email</p>
                            <p class="text-xs text-gray-600">support@couturioshop.com</p>
                        </div>
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
