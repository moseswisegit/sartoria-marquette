<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Communication Clients - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Communication</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Outils Communication -->
            <div>
                <h3 class="text-gray-900 font-bold mb-4">Outils de communication</h3>
                <div class="grid grid-cols-2 gap-3">
                    <button
                        class="flex flex-col items-center gap-2 p-4 bg-gray-50 rounded-xl border border-gray-200 hover:border-primary hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-primary text-3xl">email</span>
                        <span class="text-sm font-semibold text-gray-900">Email</span>
                        <span class="text-xs text-gray-600">Newsletter</span>
                    </button>
                    <button
                        class="flex flex-col items-center gap-2 p-4 bg-gray-50 rounded-xl border border-gray-200 hover:border-primary hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-primary text-3xl">notifications</span>
                        <span class="text-sm font-semibold text-gray-900">Push</span>
                        <span class="text-xs text-gray-600">Notifications</span>
                    </button>
                    <button
                        class="flex flex-col items-center gap-2 p-4 bg-gray-50 rounded-xl border border-gray-200 hover:border-primary hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-primary text-3xl">sms</span>
                        <span class="text-sm font-semibold text-gray-900">SMS</span>
                        <span class="text-xs text-gray-600">Messages</span>
                    </button>
                    <button
                        class="flex flex-col items-center gap-2 p-4 bg-gray-50 rounded-xl border border-gray-200 hover:border-primary hover:bg-primary/5 transition-colors">
                        <span class="material-symbols-outlined text-primary text-3xl">campaign</span>
                        <span class="text-sm font-semibold text-gray-900">Promos</span>
                        <span class="text-xs text-gray-600">Offres</span>
                    </button>
                </div>
            </div>

            <!-- Messages Récents -->
            <div>
                <h3 class="text-gray-900 font-bold mb-3">Messages récents</h3>
                <div class="space-y-2">
                    <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between mb-1">
                            <p class="font-semibold text-gray-900 text-sm">Newsletter Janvier</p>
                            <span
                                class="px-2 py-0.5 bg-green-100 text-green-700 text-xs font-semibold rounded">Envoyé</span>
                        </div>
                        <p class="text-xs text-gray-600">À 1,250 clients • 20 Jan 2025</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                        <div class="flex items-center justify-between mb-1">
                            <p class="font-semibold text-gray-900 text-sm">Promotion Printemps</p>
                            <span
                                class="px-2 py-0.5 bg-blue-100 text-blue-700 text-xs font-semibold rounded">Planifié</span>
                        </div>
                        <p class="text-xs text-gray-600">À envoyer le 1er Fév 2025</p>
                    </div>
                </div>
            </div>

            <!-- Statistiques -->
            <div class="pt-4 border-t border-gray-200">
                <h3 class="text-gray-900 font-bold mb-3">Performance</h3>
                <div class="grid grid-cols-3 gap-2">
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-lg font-bold text-primary">68%</p>
                        <p class="text-xs text-gray-600">Ouverture</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-lg font-bold text-primary">12%</p>
                        <p class="text-xs text-gray-600">Clics</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-lg font-bold text-primary">3.2%</p>
                        <p class="text-xs text-gray-600">Conversions</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
