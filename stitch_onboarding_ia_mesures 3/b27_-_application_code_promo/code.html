<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Code Promo - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Code promo</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div class="bg-gradient-to-br from-primary/10 to-primary/5 rounded-xl p-5 border border-primary/20 text-center">
                <span class="material-symbols-outlined text-primary text-5xl mb-3">local_offer</span>
                <h3 class="text-xl font-bold text-gray-900 mb-2">Code promo</h3>
                <p class="text-sm text-gray-600">Entrez votre code pour bénéficier d'une réduction</p>
            </div>
            
            <form class="flex flex-col gap-5" onsubmit="event.preventDefault()">
                <div class="flex flex-col gap-2">
                    <label class="text-sm font-medium text-gray-700">Code promo</label>
                    <div class="flex gap-2">
                        <input type="text" placeholder="Entrez le code" class="flex-1 rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 placeholder:text-gray-400 focus:border-primary focus:ring-1 focus:ring-primary outline-none uppercase" />
                        <button type="button" class="px-6 py-3.5 bg-primary text-white rounded-xl font-semibold hover:bg-primary/90 transition-colors">
                            Appliquer
                        </button>
                    </div>
                </div>
                
                <!-- Code appliqué -->
                <div class="bg-green-50 border border-green-200 rounded-xl p-4">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-green-600">check_circle</span>
                            <p class="font-semibold text-green-900">PROMO2025</p>
                        </div>
                        <button class="text-red-600 hover:text-red-700">
                            <span class="material-symbols-outlined text-xl">close</span>
                        </button>
                    </div>
                    <p class="text-sm text-green-800">Réduction de <span class="font-bold">-3,000 FCFA</span> appliquée</p>
                    <p class="text-xs text-green-700 mt-1">Valable jusqu'au 31/12/2025</p>
                </div>
                
                <!-- Récapitulatif -->
                <div class="bg-gray-50 rounded-xl p-4 border border-gray-200">
                    <div class="space-y-2">
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Sous-total</span>
                            <span class="font-semibold text-gray-900">43,000 FCFA</span>
                        </div>
                        <div class="flex justify-between text-sm">
                            <span class="text-gray-600">Réduction</span>
                            <span class="font-semibold text-green-600">-3,000 FCFA</span>
                        </div>
                        <div class="flex justify-between text-sm pt-2 border-t border-gray-200">
                            <span class="font-bold text-gray-900">Total</span>
                            <span class="font-bold text-primary text-lg">40,000 FCFA</span>
                        </div>
                    </div>
                </div>
            </form>
        </div>
    </div>
</body>
</html>
