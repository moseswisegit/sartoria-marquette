<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Commissions Détaillées - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Commissions</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            
            <form class="flex flex-col gap-5" onsubmit="event.preventDefault()">
                <!-- Taux de commission -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-4">Taux de commission</h3>
                    <div class="space-y-3">
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-medium text-gray-700">Commission tailleurs (%)</label>
                            <input type="number" value="5" min="0" max="50" step="0.1" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                            <p class="text-xs text-gray-600">Pourcentage prélevé sur chaque commande tailleur</p>
                        </div>
                        <div class="flex flex-col gap-2">
                            <label class="text-sm font-medium text-gray-700">Commission revendeurs (%)</label>
                            <input type="number" value="10" min="0" max="50" step="0.1" class="w-full rounded-xl border border-gray-300 bg-white p-3.5 text-base text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                            <p class="text-xs text-gray-600">Pourcentage prélevé sur chaque vente revendeur</p>
                        </div>
                    </div>
                </div>
                
                <!-- Commission par montant -->
                <div>
                    <h3 class="text-gray-900 font-bold mb-4">Commission par tranche</h3>
                    <div class="space-y-2">
                        <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-semibold text-gray-900 text-sm">0 - 50,000 FCFA</span>
                                <input type="number" value="10" min="0" max="50" step="0.1" class="w-20 rounded-lg border border-gray-300 bg-white p-2 text-center text-sm font-semibold" />
                                <span class="text-sm text-gray-600">%</span>
                            </div>
                        </div>
                        <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-semibold text-gray-900 text-sm">50,000 - 200,000 FCFA</span>
                                <input type="number" value="8" min="0" max="50" step="0.1" class="w-20 rounded-lg border border-gray-300 bg-white p-2 text-center text-sm font-semibold" />
                                <span class="text-sm text-gray-600">%</span>
                            </div>
                        </div>
                        <div class="p-3 bg-gray-50 rounded-xl border border-gray-200">
                            <div class="flex items-center justify-between mb-2">
                                <span class="font-semibold text-gray-900 text-sm">200,000+ FCFA</span>
                                <input type="number" value="5" min="0" max="50" step="0.1" class="w-20 rounded-lg border border-gray-300 bg-white p-2 text-center text-sm font-semibold" />
                                <span class="text-sm text-gray-600">%</span>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Statistiques -->
                <div class="pt-4 border-t border-gray-200">
                    <h3 class="text-gray-900 font-bold mb-3">Commissions ce mois</h3>
                    <div class="grid grid-cols-2 gap-3">
                        <div class="p-3 bg-gray-50 rounded-xl text-center">
                            <p class="text-xl font-bold text-primary">2.25M</p>
                            <p class="text-xs text-gray-600">FCFA</p>
                        </div>
                        <div class="p-3 bg-gray-50 rounded-xl text-center">
                            <p class="text-xl font-bold text-primary">1,245</p>
                            <p class="text-xs text-gray-600">Transactions</p>
                        </div>
                    </div>
                </div>
                
                <button type="submit" class="w-full mt-4 flex items-center justify-center rounded-xl h-14 px-5 bg-primary text-white text-base font-bold shadow-lg shadow-primary/20 hover:bg-primary/90 transition-colors">
                    <span>Enregistrer les paramètres</span>
                </button>
            </form>
            
        </div>
    </div>
</body>
</html>
