<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Rapport Mensuel - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light font-display text-gray-900">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Rapport</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Sélection Période -->
            <div>
                <label class="text-sm font-medium text-gray-700 mb-2 block">Période</label>
                <div class="flex gap-2">
                    <input type="month" value="2025-01" class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                    <input type="month" value="2025-01" class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
                </div>
            </div>
            
            <!-- Aperçu Rapport -->
            <div class="bg-gray-50 rounded-xl p-5 border border-gray-200">
                <h3 class="text-gray-900 font-bold mb-4">Aperçu du rapport</h3>
                <div class="space-y-3">
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">Période</span>
                        <span class="text-sm font-semibold text-gray-900">Janvier 2025</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">Commandes totales</span>
                        <span class="text-sm font-semibold text-gray-900">24</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">Revenus totaux</span>
                        <span class="text-sm font-bold text-primary">1,080,000 FCFA</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">Clients actifs</span>
                        <span class="text-sm font-semibold text-gray-900">18</span>
                    </div>
                    <div class="flex items-center justify-between">
                        <span class="text-sm text-gray-600">Nouveaux clients</span>
                        <span class="text-sm font-semibold text-gray-900">5</span>
                    </div>
                </div>
            </div>
            
            <!-- Contenu du rapport -->
            <div>
                <h3 class="text-gray-900 font-bold mb-3">Contenu du rapport</h3>
                <div class="space-y-2">
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-semibold text-gray-900">Résumé d'activité</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-semibold text-gray-900">Top clients</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-semibold text-gray-900">Revenus détaillés</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox" checked class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-semibold text-gray-900">Graphiques</span>
                    </label>
                    <label class="flex items-center gap-3 p-3 bg-gray-50 rounded-xl cursor-pointer">
                        <input type="checkbox" class="h-5 w-5 text-primary border-gray-300 rounded focus:ring-primary" />
                        <span class="font-semibold text-gray-900">Analyse des tendances</span>
                    </label>
                </div>
            </div>
            
            <!-- Actions -->
            <div class="space-y-2 pt-4">
                <button class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-primary text-white text-base font-semibold hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-xl">description</span>
                    <span>Générer et télécharger PDF</span>
                </button>
                <button class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-white border-2 border-primary text-primary text-base font-semibold hover:bg-primary/5 transition-colors">
                    <span class="material-symbols-outlined text-xl">email</span>
                    <span>Envoyer par email</span>
                </button>
            </div>
        </div>
    </div>
</body>
</html>
