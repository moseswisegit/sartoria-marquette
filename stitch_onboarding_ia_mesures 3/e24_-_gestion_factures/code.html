<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestion Factures - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Factures</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <!-- Filtres -->
            <div class="flex gap-2">
                <select
                    class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none">
                    <option>Toutes</option>
                    <option>Payées</option>
                    <option>En attente</option>
                    <option>Impayées</option>
                </select>
                <input type="month" value="2025-01"
                    class="flex-1 rounded-xl border border-gray-300 bg-white p-3 text-sm text-gray-900 focus:border-primary focus:ring-1 focus:ring-primary outline-none" />
            </div>

            <!-- Liste Factures -->
            <div class="space-y-3">
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <p class="font-mono text-xs text-gray-600">#FAC-2025-001234</p>
                            <p class="font-semibold text-gray-900">Jean Dupont</p>
                        </div>
                        <span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded">Payée</span>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <div>
                            <p class="text-xs text-gray-600">Date: 20 Jan 2025</p>
                            <p class="text-sm font-bold text-primary mt-1">45,000 FCFA</p>
                        </div>
                        <button class="text-primary hover:text-primary/80">
                            <span class="material-symbols-outlined text-xl">download</span>
                        </button>
                    </div>
                </div>

                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <p class="font-mono text-xs text-gray-600">#FAC-2025-001189</p>
                            <p class="font-semibold text-gray-900">Marie Lefebvre</p>
                        </div>
                        <span class="px-2 py-1 bg-green-100 text-green-700 text-xs font-semibold rounded">Payée</span>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <div>
                            <p class="text-xs text-gray-600">Date: 18 Jan 2025</p>
                            <p class="text-sm font-bold text-primary mt-1">35,000 FCFA</p>
                        </div>
                        <button class="text-primary hover:text-primary/80">
                            <span class="material-symbols-outlined text-xl">download</span>
                        </button>
                    </div>
                </div>

                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-2">
                        <div>
                            <p class="font-mono text-xs text-gray-600">#FAC-2025-001156</p>
                            <p class="font-semibold text-gray-900">Pierre Martin</p>
                        </div>
                        <span class="px-2 py-1 bg-orange-100 text-orange-700 text-xs font-semibold rounded">En
                            attente</span>
                    </div>
                    <div class="flex items-center justify-between mt-2">
                        <div>
                            <p class="text-xs text-gray-600">Date: 15 Jan 2025</p>
                            <p class="text-sm font-bold text-primary mt-1">52,000 FCFA</p>
                        </div>
                        <button class="text-primary hover:text-primary/80">
                            <span class="material-symbols-outlined text-xl">download</span>
                        </button>
                    </div>
                </div>
            </div>

            <!-- Statistiques -->
            <div class="pt-4 border-t border-gray-200">
                <div class="grid grid-cols-2 gap-3">
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-lg font-bold text-primary">132,000</p>
                        <p class="text-xs text-gray-600">FCFA ce mois</p>
                    </div>
                    <div class="p-3 bg-gray-50 rounded-xl text-center">
                        <p class="text-lg font-bold text-gray-900">24</p>
                        <p class="text-xs text-gray-600">Factures</p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
