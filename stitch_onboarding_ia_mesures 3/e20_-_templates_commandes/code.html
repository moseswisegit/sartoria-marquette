<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Templates Commandes - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Templates</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <div class="flex items-center justify-between mb-4">
                <h3 class="text-gray-900 font-bold text-lg">Mes templates</h3>
                <button
                    class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-xl text-sm font-semibold hover:bg-primary/90 transition-colors">
                    <span class="material-symbols-outlined text-lg">add</span>
                    <span>Créer</span>
                </button>
            </div>

            <!-- Liste Templates -->
            <div class="space-y-3">
                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <p class="font-bold text-gray-900">Costume Premium Standard</p>
                            <p class="text-xs text-gray-600">Type: Costume 3 pièces</p>
                        </div>
                        <button class="text-primary hover:text-primary/80">
                            <span class="material-symbols-outlined text-xl">more_vert</span>
                        </button>
                    </div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Prix standard</span>
                            <span class="font-semibold text-gray-900">45,000 FCFA</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Mesures par défaut</span>
                            <span class="font-semibold text-gray-900">Oui</span>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button
                            class="flex-1 px-3 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-colors">
                            Utiliser
                        </button>
                        <button
                            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                            Modifier
                        </button>
                    </div>
                </div>

                <div class="p-4 bg-gray-50 rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-3">
                        <div>
                            <p class="font-bold text-gray-900">Robe de Mariée Classique</p>
                            <p class="text-xs text-gray-600">Type: Robe</p>
                        </div>
                        <button class="text-primary hover:text-primary/80">
                            <span class="material-symbols-outlined text-xl">more_vert</span>
                        </button>
                    </div>
                    <div class="space-y-2 text-sm">
                        <div class="flex justify-between">
                            <span class="text-gray-600">Prix standard</span>
                            <span class="font-semibold text-gray-900">85,000 FCFA</span>
                        </div>
                        <div class="flex justify-between">
                            <span class="text-gray-600">Mesures par défaut</span>
                            <span class="font-semibold text-gray-900">Oui</span>
                        </div>
                    </div>
                    <div class="flex gap-2 mt-3">
                        <button
                            class="flex-1 px-3 py-2 bg-primary text-white rounded-lg text-sm font-semibold hover:bg-primary/90 transition-colors">
                            Utiliser
                        </button>
                        <button
                            class="px-3 py-2 bg-gray-100 text-gray-700 rounded-lg text-sm font-medium hover:bg-gray-200 transition-colors">
                            Modifier
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
