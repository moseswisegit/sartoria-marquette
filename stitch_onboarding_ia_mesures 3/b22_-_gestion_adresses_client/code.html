<!DOCTYPE html>
<html class="light" lang="fr">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Gestion Adresses - CouturioShop</title>
    <link href="https://fonts.googleapis.com" rel="preconnect" />
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap"
        rel="stylesheet" />
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script>
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>

<body class="bg-background-light font-display text-gray-900">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white shadow-xl pb-32">
        <!-- Header -->
        <div
            class="sticky top-0 z-50 flex items-center bg-white/90 backdrop-blur-md p-4 pb-2 justify-between border-b border-gray-100">
            <button class="flex items-center justify-center rounded-full w-10 h-10 hover:bg-gray-100 transition-colors">
                <span class="material-symbols-outlined text-gray-700">arrow_back</span>
            </button>
            <h2 class="text-gray-900 text-lg font-bold leading-tight">Mes adresses</h2>
            <div class="w-10"></div>
        </div>

        <!-- Contenu -->
        <div class="flex flex-col px-4 pt-6 pb-4 gap-6">
            <button
                class="w-full flex items-center justify-center gap-2 rounded-xl h-12 px-5 bg-primary text-white text-base font-semibold hover:bg-primary/90 transition-colors">
                <span class="material-symbols-outlined text-xl">add</span>
                <span>Ajouter une nouvelle adresse</span>
            </button>

            <!-- Liste Adresses -->
            <div class="space-y-3">
                <div class="p-4 bg-gray-50 rounded-xl border-2 border-primary border-dashed">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-primary text-xl">home</span>
                            <p class="font-semibold text-gray-900">Domicile</p>
                        </div>
                        <span class="px-2 py-1 bg-primary text-white text-xs font-semibold rounded">Par défaut</span>
                    </div>
                    <p class="text-sm text-gray-700 mb-1">Jean Dupont</p>
                    <p class="text-sm text-gray-700">123 Rue de la République</p>
                    <p class="text-sm text-gray-700">Cotonou, Bénin</p>
                    <p class="text-sm text-gray-600 mt-2">+229 XX XX XX XX</p>
                    <div class="flex gap-3 mt-3">
                        <button class="flex-1 text-sm text-primary hover:underline font-medium">Modifier</button>
                        <button class="text-sm text-red-600 hover:text-red-700 font-medium">Supprimer</button>
                    </div>
                </div>

                <div class="p-4 bg-white rounded-xl border border-gray-200">
                    <div class="flex items-center justify-between mb-2">
                        <div class="flex items-center gap-2">
                            <span class="material-symbols-outlined text-gray-600 text-xl">work</span>
                            <p class="font-semibold text-gray-900">Travail</p>
                        </div>
                    </div>
                    <p class="text-sm text-gray-700 mb-1">Jean Dupont</p>
                    <p class="text-sm text-gray-700">456 Avenue de la Paix</p>
                    <p class="text-sm text-gray-700">Cotonou, Bénin</p>
                    <p class="text-sm text-gray-600 mt-2">+229 XX XX XX XX</p>
                    <div class="flex gap-3 mt-3">
                        <button class="flex-1 text-sm text-primary hover:underline font-medium">Définir par
                            défaut</button>
                        <button class="text-sm text-primary hover:underline font-medium">Modifier</button>
                        <button class="text-sm text-red-600 hover:text-red-700 font-medium">Supprimer</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>

</html>
