<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Notation & Avis Tailleur - Sartoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#121118] dark:text-white">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-slate-950 pb-20 shadow-xl">
        <!-- Header -->
        <div class="flex items-center px-4 py-4 justify-between sticky top-0 z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-gray-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <button class="p-2 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
                <h1 class="text-lg font-bold text-[#121118] dark:text-white">Noter ce tailleur</h1>
            </div>
        </div>

        <!-- Profil Tailleur -->
        <div class="px-4 pt-6 pb-4">
            <div class="flex items-center gap-4 bg-gray-50 dark:bg-slate-900 rounded-xl p-4">
                <div class="bg-center bg-no-repeat aspect-square bg-cover rounded-full size-16 ring-2 ring-primary/20" style='background-image: url("https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?w=150&h=150&fit=crop");'></div>
                <div class="flex-1">
                    <h2 class="text-lg font-bold text-[#121118] dark:text-white">Atelier Moderne</h2>
                    <p class="text-sm text-gray-600 dark:text-gray-400">Spécialisé en costumes et robes</p>
                    <div class="flex items-center gap-1 mt-1">
                        <span class="material-symbols-outlined text-yellow-400 text-[16px]">star</span>
                        <span class="text-sm font-semibold text-gray-900 dark:text-white">4.8</span>
                        <span class="text-xs text-gray-500 dark:text-gray-400">(127 avis)</span>
                    </div>
                </div>
            </div>
        </div>

        <!-- Note Globale -->
        <div class="px-4 py-4">
            <label class="block text-sm font-semibold text-[#121118] dark:text-white mb-3">Votre note globale</label>
            <div class="flex items-center justify-center gap-2 py-6 bg-gray-50 dark:bg-slate-900 rounded-xl">
                <button class="material-symbols-outlined text-[48px] text-yellow-400 hover:scale-110 transition-transform">star</button>
                <button class="material-symbols-outlined text-[48px] text-yellow-400 hover:scale-110 transition-transform">star</button>
                <button class="material-symbols-outlined text-[48px] text-yellow-400 hover:scale-110 transition-transform">star</button>
                <button class="material-symbols-outlined text-[48px] text-yellow-400 hover:scale-110 transition-transform">star</button>
                <button class="material-symbols-outlined text-[48px] text-gray-300 dark:text-gray-600 hover:scale-110 transition-transform">star</button>
            </div>
            <p class="text-center text-sm text-gray-600 dark:text-gray-400 mt-2">4 étoiles</p>
        </div>

        <!-- Critères Détaillés -->
        <div class="px-4 py-4 space-y-4">
            <label class="block text-sm font-semibold text-[#121118] dark:text-white mb-3">Détaillez votre expérience</label>
            
            <div class="space-y-3">
                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Qualité de la couture</span>
                        <span class="text-xs text-gray-500">5/5</span>
                    </div>
                    <div class="flex gap-1">
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Respect des délais</span>
                        <span class="text-xs text-gray-500">4/5</span>
                    </div>
                    <div class="flex gap-1">
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-gray-300 dark:text-gray-600">star</button>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Communication</span>
                        <span class="text-xs text-gray-500">5/5</span>
                    </div>
                    <div class="flex gap-1">
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                    </div>
                </div>

                <div>
                    <div class="flex items-center justify-between mb-2">
                        <span class="text-sm text-gray-700 dark:text-gray-300">Rapport qualité/prix</span>
                        <span class="text-xs text-gray-500">4/5</span>
                    </div>
                    <div class="flex gap-1">
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-yellow-400">star</button>
                        <button class="material-symbols-outlined text-[24px] text-gray-300 dark:text-gray-600">star</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Commentaire -->
        <div class="px-4 py-4">
            <label class="block text-sm font-semibold text-[#121118] dark:text-white mb-3">Votre avis</label>
            <textarea class="w-full min-h-[120px] rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 p-4 text-sm text-[#121118] dark:text-white placeholder:text-gray-400 dark:placeholder:text-gray-500 focus:outline-none focus:ring-2 focus:ring-primary resize-none" placeholder="Partagez votre expérience... Que recommanderiez-vous ?"></textarea>
            <p class="text-xs text-gray-500 dark:text-gray-400 mt-2">Minimum 20 caractères</p>
        </div>

        <!-- Photos -->
        <div class="px-4 py-4">
            <label class="block text-sm font-semibold text-[#121118] dark:text-white mb-3">Photos de votre commande (optionnel)</label>
            <div class="flex gap-3 overflow-x-auto pb-2">
                <button class="flex-shrink-0 w-24 h-24 rounded-xl bg-gray-100 dark:bg-slate-800 border-2 border-dashed border-gray-300 dark:border-slate-700 flex items-center justify-center hover:bg-gray-200 dark:hover:bg-slate-700 transition-colors">
                    <span class="material-symbols-outlined text-gray-400 text-[32px]">add_photo_alternate</span>
                </button>
                <div class="flex-shrink-0 w-24 h-24 rounded-xl bg-cover bg-center" style='background-image: url("https://images.unsplash.com/photo-1594938291221-94f18dd6d426?w=200&h=200&fit=crop");'></div>
                <div class="flex-shrink-0 w-24 h-24 rounded-xl bg-cover bg-center" style='background-image: url("https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=200&h=200&fit=crop");'></div>
            </div>
        </div>

        <!-- Recommandation -->
        <div class="px-4 py-4">
            <div class="flex items-center gap-3 p-4 bg-primary/10 dark:bg-primary/20 rounded-xl border border-primary/20">
                <span class="material-symbols-outlined text-primary text-[24px]">recommend</span>
                <div class="flex-1">
                    <p class="text-sm font-semibold text-[#121118] dark:text-white">Recommandez-vous ce tailleur ?</p>
                    <div class="flex gap-4 mt-2">
                        <button class="flex-1 py-2 px-4 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors">Oui</button>
                        <button class="flex-1 py-2 px-4 bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">Non</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bouton Publier -->
        <div class="px-4 pt-4 pb-6 sticky bottom-0 bg-white dark:bg-slate-950 border-t border-gray-200 dark:border-slate-800">
            <button class="w-full py-4 bg-primary text-white rounded-xl font-semibold text-base shadow-lg shadow-primary/30 hover:bg-primary/90 transition-colors">
                Publier mon avis
            </button>
        </div>
    </div>
</body>
</html>
