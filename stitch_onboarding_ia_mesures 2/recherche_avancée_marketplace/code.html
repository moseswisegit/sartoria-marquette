<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Recherche Avancée - Sartoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#121118] dark:text-white">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-slate-950 pb-20 shadow-xl">
        <!-- Header -->
        <div class="flex items-center px-4 py-4 justify-between sticky top-0 z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-gray-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <button class="p-2 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
                <h1 class="text-lg font-bold text-[#121118] dark:text-white">Filtres de recherche</h1>
            </div>
            <button class="text-primary text-sm font-semibold">Réinitialiser</button>
        </div>

        <div class="flex-1 overflow-y-auto">
            <!-- Localisation -->
            <div class="px-4 pt-6 pb-4">
                <h2 class="text-base font-bold text-[#121118] dark:text-white mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[20px]">location_on</span>
                    Localisation
                </h2>
                <div class="space-y-3">
                    <div>
                        <label class="block text-sm text-gray-700 dark:text-gray-300 mb-2">Ville</label>
                        <select class="w-full h-12 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 px-4 text-sm text-[#121118] dark:text-white focus:outline-none focus:ring-2 focus:ring-primary">
                            <option>Toutes les villes</option>
                            <option>Cotonou</option>
                            <option>Porto-Novo</option>
                            <option>Parakou</option>
                            <option>Abomey-Calavi</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-gray-700 dark:text-gray-300 mb-2">Quartier</label>
                        <input type="text" placeholder="Rechercher un quartier..." class="w-full h-12 rounded-xl bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 px-4 text-sm text-[#121118] dark:text-white placeholder:text-gray-400 focus:outline-none focus:ring-2 focus:ring-primary"/>
                    </div>
                    <div class="flex items-center gap-2 pt-2">
                        <input type="checkbox" id="nearby" class="w-5 h-5 text-primary rounded border-gray-300 focus:ring-primary"/>
                        <label for="nearby" class="text-sm text-gray-700 dark:text-gray-300">Afficher uniquement les tailleurs à proximité</label>
                    </div>
                </div>
            </div>

            <!-- Spécialités -->
            <div class="px-4 py-4">
                <h2 class="text-base font-bold text-[#121118] dark:text-white mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[20px]">style</span>
                    Spécialités
                </h2>
                <div class="flex flex-wrap gap-2">
                    <button class="px-4 py-2 bg-primary text-white rounded-full text-sm font-medium">Costumes</button>
                    <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium hover:bg-gray-200 dark:hover:bg-slate-700">Robes</button>
                    <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium hover:bg-gray-200 dark:hover:bg-slate-700">Boubous</button>
                    <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium hover:bg-gray-200 dark:hover:bg-slate-700">Tenues traditionnelles</button>
                    <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium hover:bg-gray-200 dark:hover:bg-slate-700">Uniforme</button>
                    <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium hover:bg-gray-200 dark:hover:bg-slate-700">Accessoires</button>
                </div>
            </div>

            <!-- Prix -->
            <div class="px-4 py-4">
                <h2 class="text-base font-bold text-[#121118] dark:text-white mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[20px]">payments</span>
                    Fourchette de prix
                </h2>
                <div class="space-y-4">
                    <div class="flex items-center gap-4">
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Minimum</label>
                            <input type="number" placeholder="0" class="w-full h-10 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 px-3 text-sm text-[#121118] dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"/>
                        </div>
                        <span class="text-gray-400 mt-6">-</span>
                        <div class="flex-1">
                            <label class="block text-xs text-gray-500 dark:text-gray-400 mb-1">Maximum</label>
                            <input type="number" placeholder="100 000" class="w-full h-10 rounded-lg bg-gray-50 dark:bg-slate-900 border border-gray-200 dark:border-slate-700 px-3 text-sm text-[#121118] dark:text-white focus:outline-none focus:ring-2 focus:ring-primary"/>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button class="flex-1 py-2 px-3 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-lg text-xs font-medium">0 - 10k</button>
                        <button class="flex-1 py-2 px-3 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-lg text-xs font-medium">10k - 25k</button>
                        <button class="flex-1 py-2 px-3 bg-primary text-white rounded-lg text-xs font-medium">25k - 50k</button>
                        <button class="flex-1 py-2 px-3 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-lg text-xs font-medium">50k+</button>
                    </div>
                </div>
            </div>

            <!-- Note Minimale -->
            <div class="px-4 py-4">
                <h2 class="text-base font-bold text-[#121118] dark:text-white mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[20px]">star</span>
                    Note minimale
                </h2>
                <div class="flex items-center gap-3">
                    <button class="flex items-center gap-2 px-4 py-2 bg-primary text-white rounded-lg text-sm font-medium">
                        <span class="material-symbols-outlined text-[18px]">star</span>
                        4.0+
                    </button>
                    <button class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium">4.5+</button>
                    <button class="flex items-center gap-2 px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium">5.0</button>
                </div>
            </div>

            <!-- Disponibilité -->
            <div class="px-4 py-4">
                <h2 class="text-base font-bold text-[#121118] dark:text-white mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[20px]">event_available</span>
                    Disponibilité
                </h2>
                <div class="space-y-2">
                    <div class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-slate-900 rounded-xl">
                        <input type="checkbox" id="available-now" class="w-5 h-5 text-primary rounded border-gray-300 focus:ring-primary"/>
                        <label for="available-now" class="flex-1 text-sm text-gray-700 dark:text-gray-300">Disponible maintenant</label>
                    </div>
                    <div class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-slate-900 rounded-xl">
                        <input type="checkbox" id="available-week" class="w-5 h-5 text-primary rounded border-gray-300 focus:ring-primary"/>
                        <label for="available-week" class="flex-1 text-sm text-gray-700 dark:text-gray-300">Disponible cette semaine</label>
                    </div>
                    <div class="flex items-center gap-3 p-3 bg-gray-50 dark:bg-slate-900 rounded-xl">
                        <input type="checkbox" id="fast-delivery" class="w-5 h-5 text-primary rounded border-gray-300 focus:ring-primary" checked/>
                        <label for="fast-delivery" class="flex-1 text-sm text-gray-700 dark:text-gray-300">Livraison rapide (≤ 7 jours)</label>
                    </div>
                </div>
            </div>

            <!-- Tri -->
            <div class="px-4 py-4">
                <h2 class="text-base font-bold text-[#121118] dark:text-white mb-4 flex items-center gap-2">
                    <span class="material-symbols-outlined text-primary text-[20px]">sort</span>
                    Trier par
                </h2>
                <div class="space-y-2">
                    <button class="w-full flex items-center justify-between p-3 bg-primary/10 dark:bg-primary/20 border border-primary/20 rounded-xl">
                        <span class="text-sm font-medium text-[#121118] dark:text-white">Pertinence</span>
                        <span class="material-symbols-outlined text-primary text-[20px]">check</span>
                    </button>
                    <button class="w-full flex items-center justify-between p-3 bg-gray-50 dark:bg-slate-900 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Note la plus élevée</span>
                    </button>
                    <button class="w-full flex items-center justify-between p-3 bg-gray-50 dark:bg-slate-900 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Prix croissant</span>
                    </button>
                    <button class="w-full flex items-center justify-between p-3 bg-gray-50 dark:bg-slate-900 rounded-xl hover:bg-gray-100 dark:hover:bg-slate-800">
                        <span class="text-sm font-medium text-gray-700 dark:text-gray-300">Plus proche</span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Bouton Appliquer -->
        <div class="px-4 pt-4 pb-6 sticky bottom-0 bg-white dark:bg-slate-950 border-t border-gray-200 dark:border-slate-800">
            <button class="w-full py-4 bg-primary text-white rounded-xl font-semibold text-base shadow-lg shadow-primary/30 hover:bg-primary/90 transition-colors">
                Appliquer les filtres (24 résultats)
            </button>
        </div>
    </div>
</body>
</html>
