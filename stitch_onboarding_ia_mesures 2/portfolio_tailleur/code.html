<!DOCTYPE html>
<html class="light" lang="fr">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Portfolio Tailleur - Sartoria</title>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com" rel="preconnect"/>
    <link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
    <style>
        body {
            min-height: max(884px, 100dvh);
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#121118] dark:text-white">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden max-w-md mx-auto bg-white dark:bg-slate-950 pb-20 shadow-xl">
        <!-- Header -->
        <div class="flex items-center px-4 py-4 justify-between sticky top-0 z-50 bg-white/90 dark:bg-slate-950/90 backdrop-blur-md border-b border-gray-200 dark:border-slate-800">
            <div class="flex items-center gap-3">
                <button class="p-2 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                    <span class="material-symbols-outlined text-[24px]">arrow_back</span>
                </button>
                <h1 class="text-lg font-bold text-[#121118] dark:text-white">Mon Portfolio</h1>
            </div>
            <button class="p-2 hover:bg-gray-100 dark:hover:bg-slate-800 rounded-full transition-colors">
                <span class="material-symbols-outlined text-[24px] text-primary">add_photo_alternate</span>
            </button>
        </div>

        <!-- Stats Portfolio -->
        <div class="px-4 pt-4 pb-2">
            <div class="bg-gradient-to-r from-primary/10 to-primary/5 dark:from-primary/20 dark:to-primary/10 rounded-xl p-4 border border-primary/20">
                <div class="flex items-center justify-between">
                    <div>
                        <p class="text-2xl font-bold text-[#121118] dark:text-white">24</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Réalisations publiées</p>
                    </div>
                    <div class="text-right">
                        <p class="text-2xl font-bold text-[#121118] dark:text-white">1.2k</p>
                        <p class="text-sm text-gray-600 dark:text-gray-400">Vues totales</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Filtres Catégories -->
        <div class="px-4 pt-4 pb-2">
            <div class="flex gap-2 overflow-x-auto no-scrollbar">
                <button class="px-4 py-2 bg-primary text-white rounded-full text-sm font-medium whitespace-nowrap">Toutes</button>
                <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium whitespace-nowrap">Costumes</button>
                <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium whitespace-nowrap">Robes</button>
                <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium whitespace-nowrap">Boubous</button>
                <button class="px-4 py-2 bg-gray-100 dark:bg-slate-800 text-gray-700 dark:text-gray-300 rounded-full text-sm font-medium whitespace-nowrap">Tenues</button>
            </div>
        </div>

        <!-- Galerie Portfolio -->
        <div class="flex-1 overflow-y-auto px-4 pt-4 pb-4">
            <div class="grid grid-cols-2 gap-3">
                <!-- Item 1 - Mise en avant -->
                <div class="relative group">
                    <div class="aspect-square rounded-xl bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1594938291221-94f18dd6d426?w=400&h=400&fit=crop");'>
                        <div class="absolute inset-0 bg-gradient-to-t from-black/60 to-transparent"></div>
                        <div class="absolute bottom-2 left-2 right-2">
                            <div class="flex items-center gap-1 mb-1">
                                <span class="material-symbols-outlined text-yellow-400 text-[14px]">star</span>
                                <span class="text-white text-xs font-semibold">Mise en avant</span>
                            </div>
                            <p class="text-white text-xs font-medium truncate">Costume 3 pièces</p>
                        </div>
                        <button class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-[16px] text-gray-800">more_vert</span>
                        </button>
                    </div>
                </div>

                <!-- Item 2 -->
                <div class="relative group">
                    <div class="aspect-square rounded-xl bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1515886657613-9f3515b0c78f?w=400&h=400&fit=crop");'>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
                        <button class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-[16px] text-gray-800">more_vert</span>
                        </button>
                    </div>
                </div>

                <!-- Item 3 -->
                <div class="relative group">
                    <div class="aspect-square rounded-xl bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400&h=400&fit=crop");'>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
                        <button class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-[16px] text-gray-800">more_vert</span>
                        </button>
                    </div>
                </div>

                <!-- Item 4 -->
                <div class="relative group">
                    <div class="aspect-square rounded-xl bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1572804013309-59a88b7e92f1?w=400&h=400&fit=crop");'>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
                        <button class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-[16px] text-gray-800">more_vert</span>
                        </button>
                    </div>
                </div>

                <!-- Item 5 -->
                <div class="relative group">
                    <div class="aspect-square rounded-xl bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1562157873-818bc0726f68?w=400&h=400&fit=crop");'>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
                        <button class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-[16px] text-gray-800">more_vert</span>
                        </button>
                    </div>
                </div>

                <!-- Item 6 -->
                <div class="relative group">
                    <div class="aspect-square rounded-xl bg-cover bg-center overflow-hidden" style='background-image: url("https://images.unsplash.com/photo-1591047139829-d91aecb6caea?w=400&h=400&fit=crop");'>
                        <div class="absolute inset-0 bg-black/0 group-hover:bg-black/20 transition-colors"></div>
                        <button class="absolute top-2 right-2 p-1.5 bg-white/90 rounded-full opacity-0 group-hover:opacity-100 transition-opacity">
                            <span class="material-symbols-outlined text-[16px] text-gray-800">more_vert</span>
                        </button>
                    </div>
                </div>
            </div>
        </div>

        <!-- Actions -->
        <div class="px-4 pt-2 pb-4">
            <div class="bg-gray-50 dark:bg-slate-900 rounded-xl p-4 border border-gray-200 dark:border-slate-800">
                <div class="flex items-center justify-between mb-3">
                    <div>
                        <h3 class="text-sm font-bold text-[#121118] dark:text-white mb-1">Organiser votre portfolio</h3>
                        <p class="text-xs text-gray-600 dark:text-gray-400">Mettez en avant vos meilleures réalisations</p>
                    </div>
                    <span class="material-symbols-outlined text-primary text-[24px]">auto_awesome</span>
                </div>
                <div class="flex gap-2">
                    <button class="flex-1 py-2 px-3 bg-primary text-white rounded-lg text-sm font-medium hover:bg-primary/90 transition-colors">
                        Réorganiser
                    </button>
                    <button class="flex-1 py-2 px-3 bg-gray-200 dark:bg-slate-700 text-gray-700 dark:text-gray-300 rounded-lg text-sm font-medium hover:bg-gray-300 dark:hover:bg-slate-600 transition-colors">
                        Paramètres
                    </button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
