<!DOCTYPE html>
<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Mot de Passe Oublié</title>
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#1A73B5",
                        "background-light": "#f6f6f8",
                        "background-dark": "#131022",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
                },
            },
        }
    </script>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body>
<div class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark group/design-root overflow-x-hidden font-display">
<div class="flex items-center bg-transparent p-4 pb-2 justify-between">
<div class="text-[#121118] dark:text-white flex size-12 shrink-0 items-center justify-center cursor-pointer rounded-full hover:bg-gray-200 dark:hover:bg-gray-800 transition-colors">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</div>
<div class="w-12"></div> 
</div>
<div class="@container w-full max-w-md mx-auto">
<div class="px-4 py-3">
<div class="w-full bg-center bg-no-repeat bg-cover flex flex-col justify-end overflow-hidden rounded-xl min-h-[240px] shadow-sm relative" data-alt="Abstract secure lock illustration with elegant fashion fabric patterns" style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuD_tcJERL-SN18VExjZdhWgw-WbMLeL0BniPXaN99A_FKyw7e0iyRN5FCuA9h0C-MNN4k3HLlMWgk4-dBsejC4JGpsWQDKrkphBIZ4TRim1B7Nyewq9IuZVocYrIZWYPROBXjjUVyrUpANn3i5PlThhLGiUyHdLG270o80w6sbGk030S2fK4hvevY-bWoUqiX_Tl4iZHKeJmlOJtsjpN230NpJdj5zwEoCHb1Rxktj_6Wo1_sg_ErbEuXwqXBkLkTvLBvrFYsD4dOHd");'>
<div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent"></div>
</div>
</div>
</div>
<div class="flex flex-col max-w-md mx-auto w-full">
<h1 class="text-[#121118] dark:text-white tracking-tight text-[32px] font-bold leading-tight px-4 text-center pb-2 pt-4">
                Mot de Passe Oublié
            </h1>
<p class="text-[#686189] dark:text-gray-300 text-base font-normal leading-normal pb-6 pt-1 px-6 text-center">
                Entrez l'adresse e-mail associée à votre compte et nous vous enverrons un lien pour réinitialiser votre mot de passe.
            </p>
<div class="flex flex-wrap items-end gap-4 px-4 py-2">
<label class="flex flex-col min-w-40 flex-1">
<p class="text-[#121118] dark:text-gray-200 text-sm font-medium leading-normal pb-2 ml-1">Adresse e-mail</p>
<div class="relative">
<input class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-[#121118] dark:text-white focus:outline-0 focus:ring-2 focus:ring-primary/50 border border-[#dddbe6] dark:border-gray-700 bg-white dark:bg-gray-800 focus:border-primary h-14 placeholder:text-[#9CA3AF] p-[15px] text-base font-normal leading-normal transition-all" placeholder="exemple@email.com" type="email" value=""/>
<div class="absolute right-4 top-1/2 -translate-y-1/2 text-[#9CA3AF]">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
</div>
</label>
</div>
<div class="px-4 py-6">
<button class="flex w-full cursor-pointer items-center justify-center overflow-hidden rounded-xl h-14 px-5 bg-primary hover:bg-primary/90 active:scale-[0.98] transition-all text-white text-base font-bold leading-normal tracking-[0.015em] shadow-lg shadow-primary/20">
<span class="truncate">Envoyer le lien de réinitialisation</span>
</button>
</div>
<div class="flex flex-col items-center justify-center px-4 pb-8 mt-auto">
<p class="text-[#686189] dark:text-gray-400 text-sm text-center">
                    Vous n'avez plus accès à cet e-mail ? <br/>
<a class="text-primary font-medium hover:underline inline-flex items-center gap-1 mt-1" href="#">
                        Contactez le support
                        <span class="material-symbols-outlined text-sm">open_in_new</span>
</a>
</p>
</div>
</div>
<div class="h-10 bg-transparent"></div>
</div>

</body></html>
